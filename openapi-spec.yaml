    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: otok
      description: 'Bearer token authentication. Include the token in the Authorization
        header:

        `Authorization: Bearer <your-token>`

        '
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'API key authentication via header. Create API keys in the Supermetrics
        Hub.

        '
    BearerKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: API_KEY
      description: 'API key passed as a bearer token. Create API keys in the Supermetrics
        Hub

