        user_email:
          type: string
          maxLength: 255
          description: Supermetrics user email
        login_url:
          type: string
          maxLength: 500
          description: Full URL to initiate an authentication attempt. Can be accessed
            multiple times while link is open.
        created_time:
          type: string
          format: date-time
          maxLength: 50
          description: ISO 8601 datetime for when login link was created
        expiry_time:
          type: string
          format: date-time
          maxLength: 50
          description: ISO 8601 datetime for when login link will expire
        login_id:
          type: string
          nullable: true
          maxLength: 50
          description: Supermetrics login ID for a successful authentication
        login_time:
          type: string
          nullable: true
          format: date-time
          maxLength: 50
          description: ISO 8601 datetime for when authentication occurred
        login_username:
          type: string
          nullable: true
          maxLength: 255
          description: Username used to authenticate to data source
    LoginLinkResponse:
      type: object
      properties:
        meta:
          type: object
          description: Metadata included in every API response.
          properties:
            request_id:
              $ref: '#/components/schemas/RequestId'
          required:
          - request_id
          additionalProperties: false
        data:
          $ref: '#/components/schemas/LoginLink'
    LoginRevokeResponse:
      type: object
      description: Response envelope for a data source login revoke operation
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          type: object
          description: Result payload for the revoke operation
          properties:
            result:
              type: boolean
              description: Whether the revoke operation was successful
              example: true
    LookupStep:
      type: object
      description: A transformation step that maps input values to output values using
        a key/value lookup table and a matching rule.
      required:
      - type
      - rule
      - map
      properties:
        type:
          type: string
          enum:
          - lookup
          example: lookup
          description: Discriminator value identifying this step as a lookup step.
        source:
          $ref: '#/components/schemas/DefinitionValue'
        rule:
          type: string
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
          description: The matching rule applied when looking up a value (e.g. equals).
          example: equals
        map:
          type: object
          description: Key/value mapping table used by the lookup.
          additionalProperties:
            type: string
            maxLength: 2048
            description: Output value produced for the matching key.
          example:
            '1': '2'
            a: b
        default:
          $ref: '#/components/schemas/DefinitionValue'
        description:
          type: string
          maxLength: 2048
          pattern: ^[\s\S]+$
          nullable: true
          description: Optional free-text description of the transformation step.
          example: null
    Meta:
      type: object
      description: Metadata included in every API response.
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
      required:
      - request_id
      additionalProperties: false
    MetaWithPagination:
      description: Response metadata including pagination details.
      allOf:
      - $ref: '#/components/schemas/Meta'
      - type: object
        properties:
          pagination:
            $ref: '#/components/schemas/Pagination'
        required:
        - pagination
    MetadataOutput:
      description: 'Success envelope describing the metadata available for building
        custom fields: the functions, condition/lookup rules, field data types, output
        data types, and the team''s transformation-step limit.'
      allOf:
      - $ref: '#/components/schemas/AbstractResponse'
      - type: object
        required:
        - data
        properties:
          data:
            type: object
            description: Metadata for custom field transformations.
            properties:
              rules:
                type: object
                description: Matching rules available for condition and lookup steps.
                properties:
                  condition:
                    type: object
                    description: Rules available for condition steps.
                    properties:
                      items:
                        type: array
                        maxItems: 1000
                        description: Available condition rules.
                        items:
                          $ref: '#/components/schemas/RuleOutput'
                  lookup:
                    type: object
                    description: Rules available for lookup steps.
                    properties:
                      items:
                        type: array
                        maxItems: 1000
                        description: Available lookup rules.
                        items:
                          $ref: '#/components/schemas/RuleOutput'
              functions:
                type: object
                description: Wrapper holding the available transformation functions.
                properties:
                  items:
                    type: array
                    maxItems: 1000
                    description: Available transformation functions.
                    items:
                      $ref: '#/components/schemas/FunctionSpecificationOutput'
              field_data_types:
                type: array
                maxItems: 1000
                description: Field data types that can be used for transformations.
                example:
                - string.text.value
                items:
                  type: string
                  maxLength: 100
                  pattern: ^.+$
                  description: A single field data type identifier.
              output_data_types:
                type: object
                description: Wrapper holding the available output data types.
                properties:
                  items:
                    type: array
                    maxItems: 1000
                    description: Output data types available for transformations.
                    items:
                      $ref: '#/components/schemas/OutputDataTypeOutput'
              data_transformation_steps_limit:
                type: integer
                format: int32
                minimum: 1
                maximum: 2147483647
                example: 10
                description: Maximum number of transformation steps allowed for the
                  team.
      example:
        meta:
          request_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        data:
          rules:
            condition:
              items:
              - name: equals
                display_name: EQUALS
            lookup:
              items:
              - name: equals
                display_name: EQUALS
          functions:
            items:
            - name: upper_case
              display_name: Upper Case
              description: Converts text to upper case
              group_name: String
              arguments:
              - name: value
              return_types:
              - string.text.value
          field_data_types:
          - string.text.value
          output_data_types:
            items:
            - output_type: string.text.value
              label: STRING
          data_transformation_steps_limit: 10
    OutputDataTypeOutput:
      type: object
      description: An output data type available for custom field transformations.
      properties:
        output_type:
          type: string
          maxLength: 100
          pattern: ^.+$
          example: string.text.value
          description: The output data type identifier.
        label:
          type: string
          maxLength: 100
          pattern: ^.+$
          nullable: true
          example: STRING
          description: Human-readable label describing the output type.
      example:
        output_type: string.text.value
        label: STRING
    PaginatedTransformationsOutput:
      type: object
      description: Paginated collection of custom field transformations. The `meta`
        envelope carries pagination details and `data.items` holds the page of transformations.
      properties:
        meta:
          $ref: '#/components/schemas/MetaWithPagination'
        data:
          type: object
          description: Wrapper holding the page of transformation objects.
          properties:
            items:
              type: array
              maxItems: 1000
              description: The page of transformation objects.
              example:
              - name: spec_example_field
                data_source_id: GAWA
                display_name: Spec Example Field
              items:
                $ref: '#/components/schemas/TeamTransformationOutput'
      example:
        data:
          items:
          - id: 42
            name: spec_example_field
            data_source_id: GAWA
            display_name: Spec Example Field
            description: Temporary transformation for spec examples
            field_type: dim
            data_type: string.text.value
            modified_time_utc: 2026-04-06T10:59:04+0000
            modified_user:
              email: user@supermetrics.com
              first_name: John
              last_name: Doe
            definition:
              items:
              - type: function
                name: upper_case
                arguments:
                - name: value
                  value:
                    type: data_source_field
                    value: platform
                description: null
            report_types:
            - Default
    Pagination:
      type: object
      description: Offset-based pagination metadata for list responses.
      properties:
        total_count:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
          description: Total number of items available across all pages.
          example: 137
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          description: Maximum number of items returned in this page.
          example: 20
        offset:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
          description: Number of items skipped before this page.
          example: 0
        links:
          $ref: '#/components/schemas/PaginationLinks'
      additionalProperties: false
    PaginationLinks:
      type: object
      description: Navigation links for paginated collections.
      properties:
        first:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: URL of the first page, or null when not applicable.
          example: https://api.supermetrics.com/v1/teams/team_abc/custom-fields?offset=0&limit=20
        prev:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: URL of the previous page, or null on the first page.
          example: null
        next:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: URL of the next page, or null on the last page.
          example: https://api.supermetrics.com/v1/teams/team_abc/custom-fields?offset=20&limit=20
        last:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: URL of the last page, or null when not applicable.
          example: null
      additionalProperties: false
    QueryDetails:
      type: object
      description: Per-query execution details within a transfer run.
      required:
      - status
      - rows
      properties:
        duration:
          type: number
          format: float
          nullable: true
          description: Duration of this query in seconds
          example: 12.5
        status:
          type: string
          description: Status of this query execution
          example: COMPLETED
        rows:
          type: integer
          format: int32
          minimum: 0
          description: Number of rows returned by this query
          example: 3000
        error_description:
          type: string
          nullable: true
          description: Error description if the query failed
          example: null
    RequestId:
      type: string
