  /teams/{team_id}/transfers/batch:
    post:
      summary: Batch create transfers
      description: 'Create multiple transfers in a single request. Each transfer configuration

        is created independently — if one fails, the others still succeed.

        Mixed data source types are allowed within a single batch.


        The batch must contain between 1 and 100 items. Empty batches, batches

        exceeding 100 items, and exact-duplicate configurations within the same

        batch are rejected. To create copies of an existing transfer, use the

        clone endpoint instead.

        '
      operationId: batchCreateTransfers
      tags:
      - Data Transfers
      requestBody:
        description: Batch of transfer configurations to create
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - transfers
              properties:
                transfers:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: Array of transfer configurations, each using the same
                    schema as the single-create endpoint
                  items:
                    $ref: '#/components/schemas/TransferConfigurationRequest'
      responses:
        '200':
          description: Batch processed
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: object
                    required:
                    - has_errors
                    - results
                    properties:
                      has_errors:
                        type: boolean
                        description: True if any item in the batch failed
                      results:
                        type: array
                        items:
                          type: object
                          required:
                          - index
                          - status
                          properties:
                            index:
                              type: integer
                              description: Zero-based position in the input array
                            transfer_id:
                              type: integer
                              format: int32
                              description: ID of the created transfer (present on
                                success)
                            transfer_name:
                              type: string
                              description: Display name of the created transfer (present
                                on success)
                            status:
                              type: string
                              enum:
                              - success
                              - error
                            error_code:
                              type: string
                              description: 'Machine-readable error identifier (present
                                on error).

                                Possible values: INVALID_ITEM_DATA, DWH_INVALID_TRANSFER_SETUP_DATA,

                                DWH_TRANSFER_CREATE_FAILED, DWH_BATCH_CREATE_DUPLICATE_CONFIGURATION

                                '
                            message:
                              type: string
                              description: Human-readable error description (present
                                on error)
                            validation_errors:
                              type: array
                              description: Field-level validation details (present
                                when error_code is DWH_INVALID_TRANSFER_SETUP_DATA)
                              items:
                                type: object
                                required:
                                - field_id
                                - error_code
                                - message
                                properties:
                                  field_id:
                                    type: string
                                    description: The field that failed validation
                                  error_code:
                                    type: string
                                    description: Validation error code (values originate
                                      from the validation framework, not an enum-stable
                                      set)
                                  message:
                                    type: string
                                    description: Human-readable validation error message
              example:
                meta:
                  request_id: 019461A0-0000-7000-8000-000000000000
                data:
                  has_errors: true
                  results:
                  - index: 0
                    transfer_id: 36091
                    transfer_name: GA4 -> Snowflake
                    status: success
                  - index: 1
                    status: error
                    error_code: DWH_INVALID_TRANSFER_SETUP_DATA
                    message: Transfer configuration is invalid. Check validation_errors
                      for details.
                    validation_errors:
                    - field_id: destination_id
                      error_code: Value is required
                      message: This field is required and was not provided.
        '400':
          description: 'Batch-level validation failed — no transfers are created.
            Error codes:

            DWH_BATCH_EMPTY, DWH_BATCH_TOO_LARGE, DWH_BATCH_NOT_ARRAY.

            '
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - ApiKeyAuth: []
    parameters:
    - $ref: '#/components/parameters/TeamId'
    servers:
    - url: https://dts-api.supermetrics.com
      description: Global production public Supermetrics Data Warehouse Transfers
        API base path.
