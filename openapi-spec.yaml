          example: 123
        display_name:
          type: string
          maxLength: 255
          description: Human-readable name for the destination
          example: My Snowflake Destination
        destination_type:
          $ref: '#/components/schemas/DestinationType'
        edit_settings:
          type: array
          maxItems: 500
          description: Configuration settings for the destination
          items:
            $ref: '#/components/schemas/SetupSetting'
      additionalProperties: false
    DestinationListItem:
      type: object
      required:
      - id
      - display_name
      - type
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Unique identifier for the destination
          example: 123
        display_name:
          type: string
          maxLength: 255
          description: Human-readable name for the destination
          example: My Snowflake Destination
        type:
          type: string
          maxLength: 50
          description: Destination type identifier
          example: DWH_SNOWFLAKE
      additionalProperties: false
    DestinationListResponse:
      description: Response envelope containing a list of destinations.
