    TransferRunDetail:
      type: object
      description: Detail view of a single transfer run.
      required:
      - id
      - status
      - external_id
      - query_details
      - message
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Unique identifier of the transfer run
          example: 12345
        status:
          type: string
          description: Current status of the transfer run
          example: COMPLETED
        started_time:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the transfer run started processing (ISO 8601
            format)
          example: '2024-01-15T10:00:00Z'
        ended_time:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the transfer run finished processing (ISO 8601
            format)
          example: '2024-01-15T10:05:30Z'
        created_time:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the transfer run was created (ISO 8601 format)
          example: '2024-01-15T09:55:00Z'
        queued_time:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the transfer run was queued for processing (ISO
            8601 format)
          example: '2024-01-15T09:58:00Z'
        query_details:
          type: array
          items:
            $ref: '#/components/schemas/QueryDetails'
          description: Per-query execution details for the transfer run
        external_id:
          type: string
          description: External identifier of the transfer run
          example: ext-12345
        failed_query_amount:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: Number of queries that failed during the transfer run
          example: 0
        total_duration:
          type: number
          format: float
          nullable: true
          description: Sum of all query durations in seconds
          example: 330.5
        total_rows:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: Total number of rows processed during the transfer run
          example: 15000
        query_amount:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: Total number of queries executed during the transfer run
          example: 5
        data_date:
          type: string
          format: date
          nullable: true
          description: The data date this transfer run covers
          example: '2024-01-15'
        message:
          type: string
          description: Status message or error description for the transfer run
          example: ''
    TransferRunDetailResponse:
      description: Response envelope containing a single transfer run detail.
      allOf:
      - $ref: '#/components/schemas/AbstractResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/TransferRunDetail'
        required:
        - data
    TransferRunItem:
      type: object
      description: List item view of a transfer run.
      required:
      - id
      - status
      - type
      - message
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Unique identifier of the transfer run
          example: 12345
        status:
          type: string
          description: Current status of the transfer run
          example: COMPLETED
        created_time:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the transfer run was created (ISO 8601 format)
          example: '2024-01-15T09:55:00Z'
        ended_time:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the transfer run finished processing (ISO 8601
            format)
          example: '2024-01-15T10:05:30Z'
        type:
          type: string
          description: Type of the transfer run
          enum:
          - Recurring
          - Backfill
          example: Recurring
        total_duration:
          type: number
          format: float
          nullable: true
          description: Sum of all query durations in seconds
          example: 330.5
        total_rows:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: Total number of rows processed during the transfer run
          example: 15000
        data_date:
          type: string
          format: date
          nullable: true
          description: The data date this transfer run covers
          example: '2024-01-15'
        message:
          type: string
          description: Status message or error description for the transfer run
          example: ''
    TransferRunListResponse:
      description: Response envelope containing a list of transfer runs.
      allOf:
      - $ref: '#/components/schemas/AbstractResponse'
      - type: object
        properties:
          data:
            type: array
            description: Array of transfer run objects
            items:
              $ref: '#/components/schemas/TransferRunItem'
        required:
        - data
    TransferSchedule:
      type: object
      properties:
        run_interval:
          type: string
          enum:
          - hourly
          - daily
          - weekly
          - monthly
          description: Frequency of transfer execution
        run_hour:
          type: integer
          format: int32
          minimum: 0
          maximum: 23
          description: Hour of day to run (UTC)
        refresh_window:
          type: integer
          format: int32
          minimum: 1
          description: Number of days to refresh
        run_weekday:
          type: integer
          format: int32
          minimum: 1
          maximum: 7
          description: Day of week to run (1=Monday, 7=Sunday). Required for weekly
            interval.
        run_day:
          type: integer
          format: int32
          minimum: 1
          maximum: 31
          description: Day of month to run. Required for monthly interval.
      example:
        run_interval: daily
        run_hour: 22
        refresh_window: 1
    TransferSegment:
      type: object
      properties:
        data_source_username:
          type: string
          maxLength: 255
          description: Username for data source authentication
        login_id:
          type: integer
          format: int32
          description: Login identifier
        segment_id:
          type: string
          maxLength: 100
          description: Segment identifier
        segment_name:
          type: string
          maxLength: 255
          description: Human-readable segment name
      example:
        data_source_username: user.name@supermetrics.com
        login_id: 2830506
        segment_id: '-1'
        segment_name: All users
    TransferStateUpdateResponse:
      type: object
      description: Response from changing transfer state
      properties:
        result:
          type: boolean
          description: Whether the state change succeeded
          example: true
        state:
          type: string
          description: The current state of the transfer after the action
          example: PAUSED
    TransferUpdatedResponse:
      type: object
      description: Response from updating a transfer
      properties:
        transfer_id:
          type: integer
          format: int32
          description: The ID of the updated transfer
          example: 36091
        transfer_name:
          type: string
          maxLength: 255
          description: The display name of the updated transfer
          example: AW enhanced updated
    TransformationStep:
      description: 'A single step in a custom field''s transformation pipeline. The
        concrete shape is selected by the `type` discriminator: `function`, `lookup`,
        or `condition`.'
      oneOf:
      - $ref: '#/components/schemas/FunctionStep'
      - $ref: '#/components/schemas/LookupStep'
      - $ref: '#/components/schemas/ConditionStep'
      discriminator:
        propertyName: type
        mapping:
          function: '#/components/schemas/FunctionStep'
          lookup: '#/components/schemas/LookupStep'
          condition: '#/components/schemas/ConditionStep'
    TransformationUserOutput:
      type: object
      description: The user who last modified a custom field transformation.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Email address of the user.
          example: user@supermetrics.com
        first_name:
          type: string
          maxLength: 100
          pattern: ^.+$
          description: First name of the user.
          example: John
        last_name:
          type: string
          maxLength: 100
          pattern: ^.+$
          description: Last name of the user.
          example: Doe
      example:
        email: user@supermetrics.com
        first_name: John
        last_name: Doe
    UpdateConnectorRequest:
      type: object
      description: Connector metadata and configuration to update.
      properties:
        connector:
          type: object
          description: Connector metadata to update
          required:
          - name
          - description
          properties:
            name:
              type: string
              maxLength: 255
              description: Name of the connector
            description:
              type: string
              maxLength: 1000
              description: Description of the connector
        configuration:
          type: object
          description: Connector configuration to update
          required:
          - configuration_json
          properties:
            configuration_json:
              type: object
              description: JSON configuration data
    UpdateDestinationRequest:
      type: object
      required:
      - type
      - display_name
      - fields
      properties:
        type:
          type: string
          maxLength: 50
          description: Destination type (e.g., DWH_SNOWFLAKE, DWH_BIGQUERY)
          example: DWH_SNOWFLAKE
        display_name:
          type: string
          maxLength: 255
          description: Human-readable name for the destination
          example: My Snowflake Destination
        auth_method:
          type: string
          maxLength: 100
          description: Authentication method for the destination
          example: AUTH_METHOD_KEY_PAIR
        fields:
          type: object
          description: Destination-specific configuration fields (varies by destination
            type)
          additionalProperties: true
        new_password:
          type: string
          maxLength: 255
          description: New secret value for credential rotation. Field name varies
            by auth method (e.g., new_private_key for key-pair auth)
      additionalProperties: false
    UpdateSecretRequest:
      type: object
      description: New secret value to overwrite the existing one.
      required:
      - secret_value
      properties:
        secret_value:
          type: string
          maxLength: 10000
          description: New plaintext value to overwrite the existing one
          example: new-secret-value
    User:
      type: object
      properties:
        '@type':
          type: string
          enum:
          - user
        user_id:
          type: string
          maxLength: 50
          pattern: ^[A-Za-z0-9_-]+$
          description: Supermetrics user ID
        email:
          type: string
          format: email
          maxLength: 255
          description: Supermetrics user email
    ValidationError:
