      example: 936506
  headers:
    Access-Control-Allow-Origin:
      description: CORS header
      schema:
        type: string
        maxLength: 255
        enum:
        - '*'
        example: '*'
    Content-Type:
      description: HTTP response content type
      schema:
        type: string
        maxLength: 255
        enum:
        - application/json
        example: application/json
    Location:
      description: URL of the created resource
      schema:
        type: string
        format: uri
        maxLength: 500
    X-RateLimit-Limit:
      description: Request limit per hour
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 10000
        example: 5000
    X-RateLimit-Remaining:
