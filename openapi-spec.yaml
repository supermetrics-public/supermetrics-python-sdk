        properties:
          data:
            $ref: '#/components/schemas/DestinationInfo'
        required:
        - data
    DestinationType:
      type: object
      required:
      - type
      - title
      - icon_url
      properties:
        type:
          type: string
          maxLength: 50
          description: Destination type identifier
          example: DWH_SNOWFLAKE
        title:
          type: string
          maxLength: 255
          description: Display name for the destination type
          example: Snowflake
        icon_url:
          type: string
          format: uri
          maxLength: 2083
          description: URL to the destination type icon
          example: https://supermetrics.com/icons/snowflake.svg
        connection_check_url:
          type: string
          format: uri
          maxLength: 2083
          description: URL for connection testing
        create_url:
          type: string
          format: uri
          maxLength: 2083
          description: URL for creating a destination
        update_url_template:
          type: string
          maxLength: 2083
          description: URL template for updating a destination
        app_id:
          type: string
          maxLength: 50
          description: Application identifier
        is_internal:
          type: boolean
          description: Whether this is an internal destination type
          default: false
        settings:
          type: array
          maxItems: 500
          description: Available settings for this destination type
          items:
            $ref: '#/components/schemas/SetupSetting'
        auth_methods:
          type: array
          maxItems: 50
          description: Available authentication methods
          items:
            $ref: '#/components/schemas/AuthMethod'
      additionalProperties: false
    DestinationTypeSettings:
      type: object
      description: Configuration settings for a destination type
      properties:
        title:
          type: string
          description: Human-readable title
          example: BigQuery
        type:
          type: string
          description: Destination type identifier
          example: SQL_BQ
        connection_check_url:
          type: string
          description: URL endpoint to validate connection
        create_url:
          type: string
          description: URL to create new destination instance
        update_url_template:
          type: string
          description: URL template to update existing destination
        icon_url:
          type: string
          description: URL to destination icon
        app_id:
          type: string
          description: OAuth application ID
        is_internal:
          type: boolean
          description: Whether this destination type is for internal use only
        settings:
          type: array
          description: Setup configuration fields
          items:
            type: object
        auth_methods:
          type: array
          description: Available authentication methods
          items:
            type: object
    DestinationUsage:
      type: object
      required:
      - is_used
      - transfers
      properties:
        is_used:
          type: boolean
          description: Whether the destination is currently being used by any transfers
          example: true
        transfers:
          type: array
          maxItems: 10000
          description: List of transfers using this destination
          items:
            type: object
            required:
            - transfer_id
            - transfer_name
            properties:
              transfer_id:
                type: integer
                format: int32
                minimum: 1
                maximum: 2147483647
                description: Transfer ID
                example: 12345
              transfer_name:
                type: string
                maxLength: 255
                description: Transfer display name
                example: Google Analytics to BigQuery
    DestinationUsageResponse:
      description: Response envelope containing destination usage information.
      allOf:
      - $ref: '#/components/schemas/AbstractResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/DestinationUsage'
        required:
        - data
    Error:
      type: object
      description: Machine- and human-readable detail for a failed request.
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          maxLength: 100
          description: 'Stable, screaming-snake-case identifier for the error condition.
            Clients should branch on this, not on `message`. Common values include
            BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT_ERROR, PERMISSION_ERROR,
            UNPROCESSABLE_ENTITY, UNPROCESSABLE_CONTENT, TOO_MANY_REQUESTS, INTERNAL_SERVER_ERROR,
            DUPLICATION_FAILED, SERVICE_UNAVAILABLE; domains may define additional
            codes.

            '
          example: BAD_REQUEST
        message:
          type: string
          maxLength: 255
          pattern: ^.+$
          description: Short, human-readable summary of the error.
          example: The request was invalid.
        description:
          type: string
          maxLength: 2048
          description: Optional longer explanation specific to this occurrence.
          example: The field 'display_name' must not be empty.
      required:
      - code
      - message
      additionalProperties: false
    ErrorResponse:
      type: object
      description: Standard envelope returned by all error (4xx/5xx) responses.
      properties:
        meta:
          type: object
          description: Metadata included in every API response.
          properties:
            request_id:
              $ref: '#/components/schemas/RequestId'
          required:
          - request_id
          additionalProperties: false
        error:
          $ref: '#/components/schemas/Error'
      required:
      - meta
      - error
      additionalProperties: false
    FieldDefinition:
      type: object
      required:
      - field_id
      properties:
        field_id:
          type: string
          maxLength: 100
          description: Field ID that appears in one of the table objects
        field_name:
          type: string
          maxLength: 255
          description: Data source field name
          readOnly: true
        display_name:
          type: string
          maxLength: 255
          description: Field display name
          readOnly: true
        target_name:
          type: string
          maxLength: 255
          description: Field name in target table. Defaults to field ID in lower snake
            case.
        data_type:
          type: string
          maxLength: 100
          description: Field data type
          readOnly: true
    FunctionArgument:
      type: object
      description: A named argument supplied to a function step.
      required:
      - name
      - value
      properties:
        name:
          type: string
          maxLength: 255
          pattern: ^[A-Za-z0-9_-]+$
          description: Argument name as expected by the function.
          example: value
        value:
          $ref: '#/components/schemas/DefinitionValue'
      example:
        name: value
        value:
          type: data_source_field
          value: platform
    FunctionSpecificationOutput:
      type: object
      description: Specification of a function available for building function steps.
      properties:
        name:
          type: string
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
          example: upper_case
          description: Internal name of the function.
        display_name:
          type: string
          maxLength: 100
          pattern: ^.+$
          example: Upper Case
          description: Human-readable name of the function.
        description:
          type: string
          maxLength: 2048
          pattern: ^.+$
          example: Converts text to upper case
          description: Detailed description of what the function does.
        group_name:
          type: string
          maxLength: 100
          pattern: ^.+$
          example: String
          description: Group the function belongs to.
        arguments:
          type: array
          maxItems: 100
          description: Input arguments expected by the function.
          example:
          - name: value
          items:
            type: object
            description: A single function argument specification.
        return_types:
          type: array
          maxItems: 100
          description: Data types the function can return.
          example:
          - string.text.value
          items:
            type: string
            maxLength: 100
            pattern: ^.+$
            description: A single valid return data type.
      example:
        name: upper_case
        display_name: Upper Case
        description: Converts text to upper case
        group_name: String
        arguments:
        - name: value
        return_types:
        - string.text.value
    FunctionStep:
      type: object
      description: A transformation step that applies a named function to its arguments.
      required:
      - type
      - name
      - arguments
      properties:
        type:
          type: string
          enum:
          - function
          example: function
          description: Discriminator value identifying this step as a function step.
        name:
          type: string
          maxLength: 255
          pattern: ^[A-Za-z0-9_-]+$
          example: upper_case
          description: Name of the function to apply.
        arguments:
          type: array
          maxItems: 100
          description: Arguments passed to this function.
          items:
            $ref: '#/components/schemas/FunctionArgument'
        description:
          type: string
          maxLength: 2048
          pattern: ^[\s\S]+$
          nullable: true
          description: Optional free-text description of the transformation step.
          example: null
      example:
        type: function
        name: upper_case
        arguments:
        - name: value
          value:
            type: data_source_field
            value: platform
        description: null
    LogEntry:
      type: object
      description: A connector execution log entry.
      properties:
        id:
          type: string
          maxLength: 255
          description: Log entry identifier
          example: 123-foo
        log_time:
          type: string
          format: date-time
          maxLength: 30
          description: Timestamp of the log entry
          example: '2025-01-01T00:00:00Z'
        status:
          type: integer
          format: int32
          nullable: true
          minimum: 100
          maximum: 599
          description: HTTP status code
          example: 200
        event:
          type: string
          nullable: true
          maxLength: 255
          description: Event type
          example: auth.token.refresh
        request:
          type: string
          nullable: true
          maxLength: 1000
          description: Request method and path
          example: POST /api/oauth/token_refresh
        duration_ms:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          description: Request duration in milliseconds
          example: 253
        request_id:
          type: string
          format: uuid
          nullable: true
          description: Request tracking identifier
    LoginLink:
      type: object
      properties:
        link_id:
          type: string
          maxLength: 50
          description: Supermetrics login link ID
        status_code:
          type: string
          maxLength: 50
          description: Current link status
          enum:
          - OPEN
          - CLOSED
          - EXPIRED
        description:
          type: string
          maxLength: 1000
          description: Internal link description. Not shown during authentication
