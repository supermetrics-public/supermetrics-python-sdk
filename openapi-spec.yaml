  /teams/{team_id}/transfers/{transfer_id}/clone:
    post:
      summary: Clone transfer
      description: "Clones an existing transfer, optionally overriding selected fields.\
        \ The clone\nis a fully independent transfer — editing or deleting it never\
        \ affects the source.\n\nAll override fields use the exact same structure\
        \ as the Create Transfer endpoint.\nFields not provided in the request body\
        \ are copied from the source transfer.\nNotification recipients are deliberately\
        \ not copied (default to empty) but can\nbe overridden explicitly.\n\n**Restrictions:**\n\
        - The data source is always inherited from the source transfer and cannot\
        \ be overridden.\n  To use a different data source, create a new transfer\
        \ instead.\n- The destination can be changed to a different destination, but\
        \ only if the target\n  destination is the same type as the source (e.g. Snowflake\
        \ to Snowflake, not\n  Snowflake to BigQuery).\n\n**Returns:** The cloned\
        \ transfer object with its new ID and display name.\n"
      operationId: cloneTransfer
      tags:
      - Data Transfers
      parameters:
      - $ref: '#/components/parameters/TeamId'
      - name: transfer_id
        in: path
        required: true
        description: Unique identifier of the source transfer to clone
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        example: 36091
      requestBody:
        required: false
        description: 'Optional overrides for the cloned transfer. Omit entirely or
          send `{}` to clone as-is.

          Each field provided fully replaces the source value (no deep merge).

          '
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  maxLength: 255
                  description: Name for the clone. Defaults to "Copy of <source name>"
                  example: My Cloned Transfer
                schema_id:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 2147483647
                  description: Schema identifier
                  example: 2
                destination_id:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 2147483647
                  description: Destination identifier (must belong to the same team
                    and be the same destination type as the source)
                  example: 8
                accounts:
                  type: array
                  maxItems: 1000
                  description: Data source accounts (replaces source accounts entirely)
                  items:
                    type: object
                    required:
                    - data_source_username
                    - login_id
                    - account_id
                    properties:
                      data_source_username:
                        type: string
                        maxLength: 255
                      login_id:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 2147483647
                      account_id:
                        type: string
                        maxLength: 100
                segments:
                  type: array
                  maxItems: 100
                  description: Data segments (replaces source segments entirely)
                  items:
                    type: object
                    required:
                    - data_source_username
                    - segment_id
                    properties:
                      data_source_username:
                        type: string
                        maxLength: 255
                      segment_id:
                        type: string
                        maxLength: 100
                      segment_name:
                        type: string
                        maxLength: 255
                schedule:
                  type: array
                  maxItems: 10
                  description: Transfer execution schedule (replaces source schedule
                    entirely)
                  items:
                    type: object
                    required:
                    - run_interval
                    - refresh_window
                    properties:
                      run_interval:
                        type: string
                        enum:
                        - daily
                        - weekly
                        - monthly
                      run_hour:
                        type: integer
                        format: int32
                        minimum: 0
                        maximum: 23
                        description: Hour of day to run (UTC). Required for daily,
                          weekly, and monthly intervals.
                      run_weekday:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 7
                        description: Day of week (1=Monday, 7=Sunday). Required for
                          weekly interval.
                      run_day:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 31
                        description: Day of month. Required for monthly interval.
                      refresh_window:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 365
                data_source_settings:
                  type: array
                  maxItems: 100
                  description: Source-specific configuration settings
                  items:
                    type: object
                    properties:
                      field_id:
                        type: string
                        maxLength: 100
                      value:
                        description: Setting value (type varies by field — may be
                          a string, number, boolean, or null)
                      group:
                        type: string
                        maxLength: 100
                notification_recipients:
                  type: array
                  maxItems: 50
                  description: Email addresses for notifications (source recipients
                    are not copied by default)
                  items:
                    type: string
                    format: email
                    maxLength: 255
            example:
              display_name: My Cloned Transfer
              destination_id: 8
      responses:
        '201':
          description: Transfer cloned successfully
          headers:
            Location:
              description: URL of the created transfer resource
              schema:
                type: string
                format: uri
                maxLength: 2083
                example: https://dts-api.supermetrics.com/v1/teams/12345/transfers/36092
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
          content:
