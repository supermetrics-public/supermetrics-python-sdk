      pattern: ^[A-Za-z0-9_-]+$
      minLength: 8
      maxLength: 64
      example: BXaEFVtjc7TXaJxgZhmFgSUD9edqq_CN
      x-faker:
        random.alphaNumeric: 30
    ResourceURL:
      type: object
      properties:
        href:
          type: string
          maxLength: 500
          description: Full URL to the resource
    ResponseMeta:
      type: object
      description: Metadata included in every API response.
