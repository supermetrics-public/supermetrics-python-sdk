              type: integer
              format: int32
              minimum: 1
              maximum: 1000
              description: Used pagination limit
            total:
              type: integer
              format: int64
              minimum: 0
              maximum: 10000000
              description: Total number of accounts available
    RuleOutput:
      type: object
      description: A matching rule available for condition or lookup steps.
      properties:
        name:
          type: string
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
