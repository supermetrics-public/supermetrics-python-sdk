        blend_data_source_key:
          type: string
          maxLength: 8
          nullable: true
          pattern: ^[a-z0-9]{8}$
          description: Temporary key linking a new data source to field/join references
            within the same request. Required when creating a blend. Must be exactly
            8 lowercase alphanumeric characters.
          example: abcd1234
        display_name:
          type: string
          maxLength: 300
          pattern: ^.+
          description: Display name of the data source. Defaults to the data source
            name if omitted.
          example: Google Analytics 4
        data_source_settings:
          type: array
          maxItems: 100
          description: Settings to apply when querying this data source.
          example: []
          items:
            type: object
            description: A single key/value setting applied to the data source query.
            properties:
              id:
                type: string
                maxLength: 100
                pattern: ^.+
                description: Setting ID.
                example: currency
              value:
                description: Setting value — null, string, integer, or boolean.
                anyOf:
                - type: string
                  maxLength: 1000
                  pattern: ^.+
                  nullable: true
                - type: integer
                  format: int32
                  minimum: -2147483648
                  maximum: 2147483647
                - type: boolean
        accounts:
          type: array
          maxItems: 1000
          description: Accounts to query from this data source.
          example: []
          items:
            type: object
            description: An account selected for this data source.
            properties:
              account_id:
                type: string
                maxLength: 255
                pattern: ^.+
                description: Account identifier.
                example: '1234567890'
              account_name:
                type: string
                maxLength: 255
                pattern: ^.+
                description: Account display name.
                example: Acme Corp
              group_name:
                type: string
                maxLength: 255
                nullable: true
                pattern: ^.+
                description: Group the account belongs to, if any.
                example: EMEA
              data_source_username:
                type: string
                maxLength: 255
                pattern: ^.+
                description: Username used to authenticate with the data source.
                example: user@supermetrics.com
              data_source_display_username:
                type: string
                maxLength: 255
                pattern: ^.+
                description: Display name of the data source username.
                example: user@supermetrics.com
        segments:
          type: array
          maxItems: 100
          description: Segments to apply when querying this data source.
          example: []
          items:
            type: object
            description: A segment selected for this data source.
            properties:
              id:
                type: string
                maxLength: 255
                pattern: ^.+
                description: Segment identifier.
                example: organic_traffic
              name:
                type: string
                maxLength: 255
                pattern: ^.+
                description: Segment display name.
                example: Organic Traffic
        report_type:
          type: string
          maxLength: 100
          nullable: true
          pattern: ^.+
          description: Report type ID, if the data source supports report types.
          example: organic_search
        report_type_settings:
          type: array
          maxItems: 100
          description: Settings specific to the selected report type.
          example: []
          items:
            type: object
            description: A single key/value setting for the selected report type.
            properties:
              id:
                type: string
                maxLength: 100
                pattern: ^.+
                description: Report type setting ID.
                example: date_range
              value:
                description: Setting value — null, string, integer, or boolean.
                anyOf:
                - type: string
                  maxLength: 1000
                  nullable: true
                - type: integer
                  format: int32
                  minimum: -2147483648
                  maximum: 2147483647
                - type: boolean
    BlendedDataSourceOutput:
      type: object
      description: A data source included in the blend response, with field mappings
        and account details.
      properties:
        blend_data_source_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
          description: Internal ID of the blended data source.
          example: 1
        blend_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
          description: ID of the blend this data source belongs to.
          example: 569
        data_source_id:
          type: string
          maxLength: 100
          pattern: ^[A-Za-z0-9_]+
          description: Data source identifier.
          example: GA4
        display_name:
          type: string
          maxLength: 300
          pattern: ^.+
          description: Display name of the data source.
          example: Google Analytics 4
        data_source_settings:
          type: object
          description: Settings applied when querying this data source.
          properties:
            items:
              type: array
              maxItems: 100
              description: Setting items.
              example: []
              items:
                type: object
                description: A single data source setting.
        accounts:
          type: object
          description: Accounts queried from this data source.
          properties:
            items:
              type: array
              maxItems: 1000
              description: Account items.
              example: []
              items:
                type: object
                description: An account queried from this data source.
        segments:
          type: object
          description: Segments applied when querying this data source.
          properties:
            items:
              type: array
              maxItems: 100
              description: Segment items.
              example: []
              items:
                type: object
                description: A segment applied when querying this data source.
        report_type:
          type: string
          maxLength: 100
          nullable: true
          pattern: ^.+
          description: Report type ID.
          example: organic_search
        report_type_settings:
          type: object
          description: Settings for the selected report type.
          properties:
            items:
              type: array
              maxItems: 100
              description: Report type setting items.
              example: []
              items:
                type: object
                description: A single setting for the selected report type.
        logo_url:
          type: string
          format: uri
          maxLength: 2048
          description: Data source logo URL.
          example: https://cdn.supermetrics.com/images/datasource-logos/GA4.png
    ChangeTransferStateRequest:
      type: object
      required:
      - transfer_state
      properties:
        transfer_state:
          type: string
          enum:
          - pause
          - unpause
          description: Action to perform on the transfer state
          example: pause
      additionalProperties: false
    ConditionCase:
      type: object
      description: 'A single case within a condition step: when `condition` evaluates
        true, the `return` value is produced.'
      required:
      - return
      - condition
      properties:
        return:
          $ref: '#/components/schemas/DefinitionValue'
        condition:
          type: object
          description: The rule-based condition evaluated for this case.
          required:
          - type
          - rule
          - source
          - target
          properties:
            type:
              type: string
              enum:
              - rule
              description: Discriminator value identifying the condition kind (always
                `rule`).
              example: rule
            rule:
              type: string
              maxLength: 100
              pattern: ^[A-Za-z0-9_-]+$
              description: The comparison operator applied between `source` and `target`.
              example: equals
            source:
              $ref: '#/components/schemas/DefinitionValue'
            target:
              $ref: '#/components/schemas/DefinitionValue'
      example:
        return:
          type: output_from_previous
        condition:
          type: rule
          rule: equals
          source:
            type: output_from_previous
          target:
            type: static
            value: '1'
    ConditionStep:
      type: object
      description: A transformation step that evaluates an ordered list of cases and
        returns the result of the first matching case, falling back to `default` when
        none match.
      required:
      - type
      - cases
      - default
      properties:
        type:
          type: string
          enum:
          - condition
          example: condition
          description: Discriminator value identifying this step as a condition step.
        default:
          description: Value returned when no case matches. May be a plain DefinitionValue
            or a nested FunctionStep.
          oneOf:
          - $ref: '#/components/schemas/DefinitionValue'
          - $ref: '#/components/schemas/FunctionStep'
        cases:
          type: array
          maxItems: 100
          description: Condition cases evaluated in order; the first match wins.
          items:
            $ref: '#/components/schemas/ConditionCase'
        description:
          type: string
          maxLength: 2048
          pattern: ^[\s\S]+$
          nullable: true
          description: Optional free-text description of the transformation step.
          example: null
    Connector:
      type: object
      description: A custom connector with its metadata.
      properties:
        connector_identifier:
          type: string
          maxLength: 100
          description: Unique identifier of the connector
          example: T3S70
        name:
          type: string
          maxLength: 255
          description: Name of the connector
          example: Test Connector
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: Description of the connector
          example: A custom connector for fetching marketing data
        logo_url:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: URL of the connector logo
          example: https://assets.supermetrics.com/images/dsLogos/Custom_Connector_Default.png
        created_at:
          type: string
          format: date-time
          maxLength: 30
          description: Creation timestamp in ISO 8601 format
          example: '2025-01-01T00:00:00+00:00'
        updated_at:
          type: string
          format: date-time
          maxLength: 30
          description: Last update timestamp in ISO 8601 format
          example: '2025-01-01T00:00:00+00:00'
    ConnectorConfiguration:
      type: object
      description: Configuration data for a connector.
      properties:
        version:
          type: string
          maxLength: 20
          description: Version of the configuration
          example: 1.0.0
        configuration_json:
          type: object
          description: JSON configuration data
        created_at:
          type: string
          format: date-time
          maxLength: 30
          description: Configuration creation timestamp in ISO 8601 format
          example: '2025-01-01T00:00:00+00:00'
        updated_at:
          type: string
          format: date-time
          maxLength: 30
          description: Configuration last update timestamp in ISO 8601 format
          example: '2025-01-01T00:00:00+00:00'
    ConnectorWithConfiguration:
      description: A connector with its full configuration included.
      allOf:
      - $ref: '#/components/schemas/Connector'
      - type: object
        properties:
          configuration:
            $ref: '#/components/schemas/ConnectorConfiguration'
    CreateBackfillRequest:
      type: object
      required:
      - range_start
      - range_end
      properties:
        range_start:
          type: string
          format: date
          maxLength: 10
          description: Start date of the backfill range (inclusive)
          example: '2024-01-01'
          pattern: ^\d{4}-\d{2}-\d{2}$
        range_end:
          type: string
          format: date
          maxLength: 10
          description: End date of the backfill range (inclusive)
          example: '2024-01-31'
          pattern: ^\d{4}-\d{2}-\d{2}$
    CreateDataSourceConnectionRequest:
      type: object
      description: 'Connection configuration specifying the data source and destination
        for a Hub transfer.

        '
      properties:
        data_source_id:
          type: string
          maxLength: 50
          pattern: ^[A-Z0-9_]+$
          description: Data source identifier (e.g., "GA" for Google Analytics, "ADM"
            for Adobe Analytics Metrics)
          example: ADM
        destination_type:
          type: string
          maxLength: 50
          pattern: ^[A-Z0-9_]+$
          description: Destination type identifier (e.g., "SQL_BQ" for BigQuery, "DWH_SNOWFLAKE"
            for Snowflake)
          example: DWH_SNOWFLAKE
        api_key:
          type: string
          maxLength: 255
          pattern: ^[\s\S]+$
          description: 'API Key for authentication (optional if provided in Authorization
            header).

            This is a reserved framework parameter and will be automatically handled.

            '
          example: sk_your_api_key_here
      required:
      - data_source_id
      - destination_type
    CreateDataSourceConnectionResponse:
      description: Response envelope containing a created data source connection.
      allOf:
      - $ref: '#/components/schemas/AbstractResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/DataSourceConnection'
        required:
        - data
    CreateDestinationRequest:
      type: object
      required:
      - type
      - display_name
      - fields
      properties:
        type:
          type: string
          maxLength: 50
          description: Destination type (e.g., DWH_SNOWFLAKE, DWH_BIGQUERY)
          example: DWH_SNOWFLAKE
        display_name:
          type: string
          maxLength: 255
          description: Human-readable name for the destination
          example: My Snowflake Destination
        auth_method:
          type: string
          maxLength: 100
          description: Authentication method for the destination
          example: AUTH_METHOD_KEY_PAIR
        fields:
          type: object
          description: Destination-specific configuration fields (varies by destination
            type)
          additionalProperties: true
          example:
            hostname: any-domain.my-region.snowflakecomputing.com
            warehouse: DEMO_WH
            database_name: TEST_DB
            schema: PUBLIC
            role: ACCOUNTADMIN
            username: USER
            private_key: '-----BEGIN ENCRYPTED PRIVATE KEY-----...'
            passphrase: '***'
      additionalProperties: false
    CreateSecretRequest:
      type: object
      description: Secret name and value to encrypt and store.
      required:
      - secret_name
      - secret_value
      properties:
        secret_name:
          type: string
          maxLength: 255
          description: Human-readable name for the secret
          example: client_id
        secret_value:
          type: string
          maxLength: 10000
          description: Plaintext value to be encrypted and stored
          example: my-super-secret-value
    CustomFieldCreateRequest:
      type: object
      description: Payload for creating a new custom field (field transformation).
      required:
      - display_name
      - field_type
      - data_type
      - definition
      properties:
        data_source:
          type: array
          maxItems: 100
          description: Data sources associated with the custom field. Each entry pairs
            a data source ID with an optional report type.
          items:
            type: object
            description: A data source (and optional report type) the custom field
              applies to.
            properties:
              data_source_id:
                type: string
                maxLength: 100
                pattern: ^[a-zA-Z0-9_]{2,5}$
                description: ID of the data source.
                example: GAWA
              report_type:
                type: string
                maxLength: 100
                pattern: ^.+$
                nullable: true
                description: Report type associated with the data source, if any.
                example: something
        display_name:
          type: string
          maxLength: 255
          pattern: ^.+$
          description: User-facing name of the new custom field shown in the UI.
          example: Spec Example Field
        description:
          type: string
          maxLength: 2048
          pattern: ^.+$
          description: Free-text description of the new custom field.
          example: Temporary transformation for spec examples
        field_type:
          type: string
          enum:
          - dim
          - met
          description: 'Field kind: `dim` (dimension) or `met` (metric).'
          example: dim
        data_type:
          type: string
          maxLength: 100
          pattern: ^(bool|(float|int|string)(\.[a-z]+)+)$
          description: Data type of the custom field (e.g. string.text.value, float.number.value,
            int.number.value, bool).
          example: string.text.value
        definition:
          type: array
          maxItems: 100
          description: Ordered pipeline of transformation steps (function, lookup,
            or condition) used to compute the custom field.
          items:
            $ref: '#/components/schemas/TransformationStep'
          example:
          - type: function
            name: upper_case
            arguments:
            - name: value
              value:
                type: data_source_field
                value: platform
    CustomFieldUpdateRequest:
      type: object
      description: Payload for updating an existing custom field. The `field_type`
        cannot be changed and is therefore omitted.
      required:
      - display_name
      - data_type
      - definition
      properties:
        display_name:
          type: string
          maxLength: 255
          pattern: ^.+$
          description: User-facing name of the custom field shown in the UI.
          example: Spec Example Field Updated
        description:
          type: string
          maxLength: 2048
          pattern: ^.+$
          description: Free-text description of the custom field.
          example: Updated temporary transformation for spec examples
        data_type:
          type: string
          maxLength: 100
          pattern: ^(bool|(float|int|string)(\.[a-z]+)+)$
          description: Data type of the custom field (e.g. string.text.value, float.number.value,
            int.number.value, bool).
          example: string.text.value
        definition:
          type: array
          maxItems: 100
          description: Ordered pipeline of transformation steps (function, lookup,
            or condition) used to compute the custom field.
          items:
            $ref: '#/components/schemas/TransformationStep'
          example:
          - type: function
            name: upper_case
            arguments:
            - name: value
              value:
                type: data_source_field
                value: platform
    DataQuery:
      type: object
      properties:
        api_key:
          type: string
          maxLength: 255
          pattern: ^[A-Za-z0-9_-]+$
          description: API key when not using an authorization header
          example: abc123def456
        schedule_id:
          type: string
          maxLength: 50
          pattern: ^[A-Za-z0-9_-]+$
          description: Schedule ID for this query request. If not provided, one will
            be generated from other query parameters
          example: my_query_123
        ds_id:
          type: string
          maxLength: 50
          pattern: ^[A-Za-z0-9_-]+$
          description: Target data source ID
          example: GAWA
        ds_accounts:
          oneOf:
          - type: string
            maxLength: 50
            pattern: ^[A-Za-z0-9_-]+$
          - type: array
            maxItems: 100
            items:
              type: string
              maxLength: 50
              pattern: ^[A-Za-z0-9_-]+$
          - type: object
          description: List of data source accounts the query should target, or a
            filter for them
          example:
          - account123
          - account456
        ds_segments:
          oneOf:
          - type: string
            maxLength: 50
            pattern: ^[A-Za-z0-9_-]+$
          - type: array
            maxItems: 1000
            items:
              type: string
              maxLength: 50
              pattern: ^[A-Za-z0-9_-]+$
          description: List of data source segment IDs the query should target
          example:
          - segment1
          - segment2
        ds_user:
          type: string
          maxLength: 255
          description: Shorthand parameter to provide one value for ds_users
          example: user@example.com
        ds_users:
          oneOf:
          - type: string
            maxLength: 255
          - type: array
            maxItems: 100
            items:
              type: string
              maxLength: 255
          description: List of data source login usernames to limit when searching
            for suitable authentication
        date_range_type:
          type: string
          maxLength: 50
          description: Type of date range the query should use
        start_date:
          type: string
          maxLength: 100
          description: Fixed or relative start date for your query
          example: yesterday
        end_date:
          type: string
          maxLength: 100
          description: Fixed or relative end date for your query
          example: yesterday
        compare_type:
          type: string
          maxLength: 50
          description: Date range comparison type. Defaults to none
        compare_show:
          type: string
          maxLength: 50
          description: When compare_type is custom, display type for comparison values
        compare_start_date:
          type: string
          maxLength: 100
          description: When compare_type is custom, fixed or relative start date for
            comparison
        compare_end_date:
          type: string
          maxLength: 100
          description: When compare_type is custom, fixed or relative end date for
            comparison
        fields:
          oneOf:
          - type: string
            maxLength: 1000
          - type: array
            maxItems: 100
            items:
              type: string
              maxLength: 100
          - type: array
            maxItems: 100
            items:
              type: object
          description: Target data source fields the query should return
        settings:
          type: object
          description: Settings that should be applied when performing the query
        filter:
          type: string
          maxLength: 5000
          description: Filter string that should be applied to the results
        order_columns:
          type: string
          maxLength: 1000
          description: Order instruction for fields that are split by column
        order_rows:
          oneOf:
          - type: string
            maxLength: 1000
          - type: array
            maxItems: 50
            items:
              type: string
              maxLength: 100
          description: List of order fields and sort directions for result rows
        max_columns:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          description: Maximum number of columns the query results should contain
        max_rows:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000000
          description: Maximum number of rows the query results should contain
        offset_start:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Starting row index for paginated response
        offset_end:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Ending row index for paginated response
        cache_minutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 10080
          description: Maximum allowed age of query results cache in minutes
        sync_timeout:
          type: integer
          format: int32
          minimum: 0
          maximum: 3600
          description: Number of seconds the API should wait for query to finish
      required:
      - ds_id
    DataResponse:
      type: object
      properties:
        meta:
          type: object
          properties:
            request_id:
              type: string
              maxLength: 50
              pattern: ^[A-Za-z0-9_-]+$
              description: API request ID
            schedule_id:
              type: string
              maxLength: 50
              pattern: ^[A-Za-z0-9_-]+$
              description: Custom or generated schedule ID for the query
            status_code:
              type: string
              maxLength: 20
              description: Status code for the query
            query:
              type: object
              properties:
                start_date:
                  type: string
                  maxLength: 10
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  description: Query start date in YYYY-MM-DD format
                end_date:
                  type: string
                  maxLength: 10
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  description: Query end date in YYYY-MM-DD format
                ds_accounts:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    maxLength: 50
                    pattern: ^[A-Za-z0-9_-]+$
                  description: Data source account IDs used in the query
                ds_segments:
                  type: array
                  maxItems: 1000
                  items:
                    type: string
                    maxLength: 50
                    pattern: ^[A-Za-z0-9_-]+$
                  description: Data source segment IDs used in the query
                fields:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        maxLength: 100
                        pattern: ^[A-Za-z0-9_-]+$
                        description: Field ID from the request
                      field_id:
                        type: string
                        maxLength: 100
                        pattern: ^[A-Za-z0-9_-]+$
                        description: Field ID the API uses
                      field_name:
                        type: string
                        maxLength: 255
                        description: Field name
                      field_type:
                        type: string
                        maxLength: 10
                        description: Field type
                      field_split:
                        type: string
                        maxLength: 50
                        description: Field split by type
                      data_type:
                        type: string
                        maxLength: 50
                        description: Field data type
                      data_column:
                        type: integer
                        format: int32
                        minimum: 0
                        maximum: 1000
                        description: Field value position in each data row
                      visible:
                        type: boolean
                        description: Whether data for this field is visible
                compare_type:
                  type: string
                  maxLength: 50
                  description: Date range comparison type used
                compare_show:
                  type: string
                  maxLength: 50
                  description: Display type for comparison values
                compare_start_date:
                  type: string
                  maxLength: 10
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  description: Start date for comparison date range
                compare_end_date:
                  type: string
                  maxLength: 10
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  description: End date for comparison date range
                settings:
                  type: object
                  description: Settings used in query
                cache_minutes:
                  type: integer
                  format: int32
                  minimum: 0
                  maximum: 10080
                  description: Requested maximum age of cache in minutes
            result:
              type: object
              properties:
                total_columns:
                  type: integer
                  format: int32
                  minimum: 0
                  maximum: 1000
                  description: Total amount of columns
                total_rows:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 100000000
                  description: Total amount of rows in data
                run_seconds:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 7200
                  description: Number of seconds it took for the query to run
                data_sampled:
                  type: boolean
                  description: If data source has provided sampled data
                cache_used:
                  type: boolean
                  description: If cached data was used
                cache_time:
                  type: string
                  format: date-time
                  maxLength: 30
                  description: ISO 8601 datetime for the most recent cached data
                  nullable: true
            paginate:
              type: object
              properties:
                prev:
                  type: string
                  format: uri
                  maxLength: 500
                  description: URL to previous offset
                next:
                  type: string
                  format: uri
                  maxLength: 500
                  description: URL to next offset
        data:
          type: array
          maxItems: 1000000
          items:
            type: array
            maxItems: 1000
            items:
              type: string
              maxLength: 10000
          description: Query result rows
    DataSource:
      type: object
      properties:
        '@type':
          type: string
          enum:
          - ds
        ds_id:
          type: string
          maxLength: 50
          pattern: ^[A-Za-z0-9_-]+$
          description: Data source ID
        name:
          type: string
          maxLength: 255
          description: Data source name
    DataSourceAccount:
      type: object
      properties:
        '@type':
          type: string
          enum:
          - ds_account
        account_id:
          type: string
          maxLength: 255
          description: Data source account ID, as used in ds_accounts parameter
        name:
          type: string
          maxLength: 255
          description: Data source account name
        group:
          type: string
          maxLength: 255
          description: Group name for account in Supermetrics products
    DataSourceAccountListResponse:
      type: object
      description: Paginated response envelope containing a list of stored data source
        accounts for a login
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMetaWithPagination'
        data:
          type: array
          maxItems: 1000
          description: List of stored data source accounts
          items:
            $ref: '#/components/schemas/DataSourceAccount'
    DataSourceConnection:
      type: object
      description: A created data source connection.
      properties:
        connection_id:
          type: string
          format: uuid
          maxLength: 36
          pattern: ^[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}$
          description: Unique identifier for the created connection
          example: 019461A0-0000-7000-8000-000000000000
        login_url:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: 'URL for OAuth login flow (used when data source requires user
            authentication).

            In the current V1 implementation, this is always null.

            '
          example: null
        connect_url:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: 'URL for connection flow (used when additional authentication
            steps are required).

            In the current V1 implementation, this is always null.

            '
          example: null
      required:
      - connection_id
    DataSourceInfo:
      type: object
      description: Data source information
      properties:
        data_source_id:
          type: string
          description: Unique data source identifier
          example: AW
        service_name:
          type: string
          nullable: true
          description: Human-readable service name
          example: Google Ads
        service_provider:
          type: string
          nullable: true
          description: Service provider name
          example: Google
        logo_url:
          type: string
          nullable: true
          description: URL to the data source logo
        has_custom_fields:
          type: boolean
          description: Whether the data source supports custom account fields
        is_custom_connector:
          type: boolean
          description: Whether this is a custom connector
        is_public_beta:
          type: boolean
          description: Whether the data source is in public beta
        is_released:
          type: boolean
          description: Whether the data source is fully released
        is_internal:
          type: boolean
          nullable: true
          description: Whether the data source is for internal use only
        applicable_destinations:
          type: array
          description: Product codes this data source supports
          items:
            type: string
    DataSourceLogin:
      type: object
      properties:
        '@type':
          type: string
          enum:
          - ds_login
        login_id:
          type: string
          maxLength: 50
          pattern: ^[A-Za-z0-9_-]+$
          description: Supermetrics login ID
        login_type:
          type: string
          maxLength: 100
          description: Authentication type. Note that some data sources support multiple
            types, and user can choose between them.
        username:
          type: string
          maxLength: 255
          description: Authenticated username, used in queries as ds_user
        display_name:
          type: string
          maxLength: 255
          description: Visible name for this authentication in product UIs
        ds_info:
          $ref: '#/components/schemas/DataSource'
        default_scopes:
          type: array
          maxItems: 100
          description: List of default source API scopes used in authentication
          items:
            type: string
            maxLength: 100
        additional_scopes:
          type: array
          maxItems: 100
          description: List of additional source API scopes user has granted to access
            more data
          items:
            type: string
            maxLength: 100
        auth_time:
          type: string
          format: date-time
          maxLength: 50
          description: ISO 8601 datetime for when last user authentication occurred
        auth_user_info:
          $ref: '#/components/schemas/User'
        expiry_time:
          type: string
          nullable: true
          format: date-time
          maxLength: 50
          description: ISO 8601 datetime for when authentication expires, if any
        revoked_time:
          type: string
          nullable: true
          format: date-time
          maxLength: 50
          description: ISO 8601 datetime for when authentication was revoked, if any
        is_refreshable:
          type: boolean
          description: Whether authentication can be automatically refreshed after
            expiry time, without user involvement
        is_shared:
          type: boolean
          description: Whether login is shared with all team users
    DatasourceDetails:
      type: object
      properties:
        id:
          type: string
          maxLength: 100
