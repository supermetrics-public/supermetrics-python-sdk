openapi: 3.0.3
info:
  title: Supermetrics API
  version: 2.0.0
  description: Supermetrics API for authentication and data querying. For more information,
    visit https://supermetrics.com.
  contact:
    name: Supermetrics Support
    email: support@supermetrics.com
    url: https://supermetrics.com/support
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://api.supermetrics.com/v2
  description: Global production public Supermetrics Data API base path.
  x-internal: false
- url: https://api.supermetrics.com
  description: Global production public Supermetrics API base path for datasource
    search.
  x-internal: false
- url: https://api.supermetrics.com/v2
  description: Global production public Supermetrics Management API base path.
  x-internal: false
- url: https://api.supermetrics.com
  description: Global production public Supermetrics API base path (for Connector
    Builder and Team endpoints).
  x-internal: false
- url: https://dts-api.supermetrics.com/v1
  description: Data Backfills API
- url: https://dts-api.supermetrics.com/v1
  description: Global production public Supermetrics Data Warehouse Data Source Connections
    API base path.
  x-internal: false
- url: https://dts-api.supermetrics.com
  description: Global production public Supermetrics Data Warehouse Transfer Runs
    API base path.
  x-internal: false
- url: https://dts-api.supermetrics.com
  description: Global production public Supermetrics Data Warehouse Transfers API
    base path.
  x-internal: false
- url: https://api.supermetrics.com
  description: production server
  x-internal: false
- url: https://dts-api.supermetrics.com/v1
  description: Global production public Supermetrics Data Warehouse Destinations API
    base path.
  x-internal: false
- url: https://api.supermetrics.com/enterprise/v2
  description: Global production public Supermetrics Data Warehouse Table Groups API
    base path.
  x-internal: false
paths:
  /ds/login/link:
    post:
      summary: Create login link
      description: Create a new data source login link
      operationId: createLoginLink
      tags:
      - Data Source Login Links
      security:
      - BearerAuth: []
      requestBody:
        description: Login link creation parameters including data source and expiration
          settings
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ds_id
              properties:
                ds_id:
                  type: string
                  maxLength: 50
                  pattern: ^[A-Za-z0-9_-]+$
                  description: Data source ID
                expiry_time:
                  type: string
                  format: date-time
                  maxLength: 50
                  description: Link expiry time as datetime in ISO 8601 format or
                    relative time string (e.g. "10 hours"). Defaulting to 24 hours
                    from creation time.
                description:
                  type: string
                  maxLength: 1000
                  description: Internal description for the link. Not shown during
                    the authentication attempt.
                require_username:
                  type: string
                  maxLength: 255
                  description: Data source username that needs to be used in authentication
                    attempt. Normally used when renewing existing credentials.
                redirect_url:
                  type: string
                  format: uri
                  maxLength: 500
                  description: Custom URL to redirect to after successful authentication.
            example:
              ds_id: GAWA
              expiry_time: '2026-03-01T23:59:59Z'
              description: Google Analytics login link for marketing team
              require_username: marketing@company.com
              redirect_url: https://company.com/auth/success
      responses:
        '201':
          description: Login link created successfully
          headers:
            Content-Type:
              $ref: '#/components/headers/Content-Type'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/LinkLimitExceeded'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /ds/login/link/{link_id}:
    get:
      summary: Get login link
      description: Get details of a specific login link
      operationId: getLoginLink
      tags:
      - Data Source Login Links
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Login link details retrieved successfully
          headers:
            Content-Type:
              $ref: '#/components/headers/Content-Type'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/LinkNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    parameters:
    - name: link_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 50
        pattern: ^[A-Za-z0-9_-]+$
      description: Supermetrics login link ID
    servers:
    - url: https://api.supermetrics.com
      description: production server
      x-internal: false
    patch:
      summary: Update login link
      description: Change given properties for specified data source login link
      operationId: updateLoginLink
      security:
      - ApiKeyAuth:
        - ds_login_links_write
      parameters:
      - name: link_id
        in: path
        required: true
        description: Entity link ID
        schema:
          type: string
          maxLength: 50
          pattern: ^[A-Za-z0-9_-]+$
      requestBody:
        description: Login link update parameters for modifying link properties
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  maxLength: 1000
                  description: Description for the link
            example:
              description: Updated login link description
      responses:
        '200':
          description: Login link updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
      - Data Source Login Links
  /ds/login/link/{link_id}/close:
    put:
      summary: Close login link
      description: Close a login link. Link will stop accepting new requests once
        closed, but closing will not affect already started authentication attempts.
      operationId: closeLoginLink
      tags:
      - Data Source Login Links
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Login link closed successfully
          headers:
            Content-Type:
              $ref: '#/components/headers/Content-Type'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/LinkNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/LinkUpdateFailed'
    parameters:
    - name: link_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 50
        pattern: ^[A-Za-z0-9_-]+$
      description: Supermetrics login link ID
  /ds/login/links:
    get:
      summary: List login links
      description: List all data source login links
      operationId: listLoginLinks
      tags:
      - Data Source Login Links
      security:
      - BearerAuth: []
      responses:
        '200':
          description: List of login links retrieved successfully
          headers:
            Content-Type:
              $ref: '#/components/headers/Content-Type'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  data:
                    type: array
                    maxItems: 1000
                    items:
                      $ref: '#/components/schemas/LoginLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /ds/login/{login_id}:
    delete:
      summary: Revoke login
      description: Revoke an existing data source login
      operationId: revokeDataSourceLogin
      security:
      - ApiKeyAuth:
        - ds_logins_write
      parameters:
      - name: login_id
        in: path
        required: true
        description: Entity login ID
        schema:
          type: string
          maxLength: 50
          pattern: ^[A-Za-z0-9_-]+$
      responses:
        '200':
          description: Data source login revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginRevokeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
      - Data Source Logins
    parameters:
    - name: login_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 50
        pattern: ^[A-Za-z0-9_-]+$
      description: Supermetrics login ID
    servers:
    - url: https://api.supermetrics.com
      description: production server
      x-internal: false
    get:
      summary: Get login
      description: Retrieve details of a specific data source login
      operationId: getDataSourceLogin
      tags:
      - Data Source Logins
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Data source login details retrieved successfully
          headers:
            Content-Type:
              $ref: '#/components/headers/Content-Type'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  data:
                    $ref: '#/components/schemas/DataSourceLogin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/LoginNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/LoginSearchFailed'
  /ds/login/{login_id}/accounts:
    get:
      summary: List login accounts
      description: List stored data source accounts for specified data source login
      operationId: listDataSourceLoginAccounts
      security:
      - ApiKeyAuth:
        - ds_accounts_read
      parameters:
      - name: login_id
        in: path
        description: Entity login ID
        required: true
        schema:
          type: string
          maxLength: 50
          pattern: ^[A-Za-z0-9_-]+$
      - name: offset
        in: query
        description: Pagination offset for the number of items to return. Defaults
          to 0.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          default: 0
      - name: limit
        in: query
        description: Maximum number of items to return. Defaults to 100, maximum of
          1000 is enforced.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 100
      responses:
        '200':
          description: List of data source accounts retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceAccountListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
      - Data Source Logins
    servers:
    - url: https://api.supermetrics.com
      description: production server
      x-internal: false
  /ds/logins:
    get:
      summary: List logins
      description: Retrieve a list of all data source logins
      operationId: listDataSourceLogins
      tags:
      - Data Source Logins
      security:
      - BearerAuth: []
      responses:
        '200':
          description: List of data source logins retrieved successfully
          headers:
            Content-Type:
              $ref: '#/components/headers/Content-Type'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  data:
                    type: array
                    maxItems: 1000
                    items:
                      $ref: '#/components/schemas/DataSourceLogin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/LoginSearchFailed'
  /enterprise/v2/table/group/import:
    post:
      summary: Import table group
      description: Create a new table group from a data model.
      operationId: importTableGroup
      tags:
      - Table Groups
      security:
      - ApiKeyAuth: []
      requestBody:
        description: Table group import data including version, group configuration,
          and table definitions
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - version
              - group
              - tables
              properties:
                version:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 100
                  description: Data model version for the received data
                group:
                  $ref: '#/components/schemas/TableGroupImport'
                tables:
                  type: array
                  maxItems: 1000
                  description: List of table objects
                  items:
                    $ref: '#/components/schemas/TableDefinition'
                fields:
                  type: array
                  maxItems: 10000
                  description: List of field objects
                  items:
                    $ref: '#/components/schemas/FieldDefinition'
            example:
              version: 1
              group:
                group_name: Marketing Analytics
                ds_id: GAWA
                table_prefix: MKT
              tables:
              - table_name: SESSIONS
                table_partition: date
                fields:
                - session_id
                - date
                - users
              fields:
              - field_id: session_id
                target_name: session_id
              - field_id: date
                target_name: session_date
              - field_id: users
                target_name: user_count
      responses:
        '201':
          description: Table group imported successfully
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableGroupResponse'
        '400':
          $ref: '#/components/responses/TableGroupImportError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TableGroupNotFound'
        '409':
          $ref: '#/components/responses/TableGroupNameConflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/TableGroupCreateFailed'
    servers:
    - url: https://api.supermetrics.com/enterprise/v2
      description: Global production public Supermetrics Data Warehouse Table Groups
        API base path.
      x-internal: false
  /enterprise/v2/table/group/{group_id}:
    put:
      summary: Edit table group
      description: 'Update an existing table group''s definition (full replace).

        The request body uses the same `{group, tables, fields}` structure that Import
        accepts and Export returns, so the natural workflow is export → edit → PUT.
        The data model `version` is specified via the required query parameter, not
        in the request body.


        This is a full replace — all tables and fields must be provided. Omitting
        `fields` clears all field mappings. Tables and fields are matched to existing
        records by name. Renaming a table or field is equivalent to removing the old
        one and adding a new one — the old table''s settings and query filter linkage
        are lost.


        The `ignore_errors` and `ds_settings` properties are not yet supported on
        this endpoint and will be rejected with 422 if present.

        '
      operationId: editTableGroup
      tags:
      - Table Groups
      security:
      - ApiKeyAuth: []
      requestBody:
        description: Full table group definition to replace the existing one
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - group
              - tables
              properties:
                group:
                  $ref: '#/components/schemas/TableGroupImport'
                tables:
                  type: array
                  maxItems: 1000
                  description: List of table objects
                  items:
                    $ref: '#/components/schemas/TableDefinition'
                fields:
                  type: array
                  maxItems: 10000
                  description: List of field objects. Omitting this property clears
                    all field mappings (full replace).
                  items:
                    $ref: '#/components/schemas/FieldDefinition'
            example:
              group:
                group_name: Marketing Analytics Updated
                ds_id: GAWA
                table_prefix: MKT
              tables:
              - table_name: SESSIONS
                table_partition: date
                fields:
                - session_id
                - date
                - users
              - table_name: PAGEVIEWS
                table_partition: date
                fields:
                - date
                - page_path
                - pageviews
              fields:
              - field_id: session_id
                target_name: session_id
              - field_id: date
                target_name: session_date
              - field_id: users
                target_name: user_count
              - field_id: page_path
                target_name: page_path
              - field_id: pageviews
                target_name: page_views
      responses:
        '200':
          description: Table group updated successfully
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableGroupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TableGroupNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    parameters:
    - name: group_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 50
        pattern: ^[A-Za-z0-9_-]+$
      description: Supermetrics table group ID (prefixed, e.g. tg_123)
    - name: version
      in: query
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
      description: Data model version for the received data
    servers:
    - url: https://api.supermetrics.com/enterprise/v2
      description: Global production public Supermetrics Data Warehouse Table Groups
        API base path.
      x-internal: false
  /enterprise/v2/table/group/{group_id}/export:
    get:
      summary: Export table group
      description: Export a specific table group's data model.
      operationId: exportTableGroup
      tags:
      - Table Groups
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: Table group data model exported successfully
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                    format: int32
                    minimum: 1
                    maximum: 100
                    description: Data model version
                  group:
                    $ref: '#/components/schemas/TableGroupExport'
                  tables:
                    type: array
                    maxItems: 1000
                    description: List of table objects
                    items:
                      $ref: '#/components/schemas/TableDefinition'
                  fields:
                    type: array
                    maxItems: 10000
                    description: List of field objects
                    items:
                      $ref: '#/components/schemas/FieldDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TableGroupNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/TableGroupSearchFailed'
    parameters:
    - name: group_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 50
        pattern: ^[A-Za-z0-9_-]+$
      description: Supermetrics table group ID
    - name: version
      in: query
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
      description: Data model version for the returned data
    servers:
    - url: https://api.supermetrics.com/enterprise/v2
      description: Global production public Supermetrics Data Warehouse Table Groups
        API base path.
      x-internal: false
  /enterprise/v2/table/groups:
    get:
      summary: List table groups
      description: List all table groups available for the team.
      operationId: listTableGroups
      tags:
      - Table Groups
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: List of table groups retrieved successfully
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/Access-Control-Allow-Origin'
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: array
                    maxItems: 1000
                    items:
                      $ref: '#/components/schemas/TableGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/TableGroupSearchFailed'
    servers:
    - url: https://api.supermetrics.com/enterprise/v2
      description: Global production public Supermetrics Data Warehouse Table Groups
        API base path.
      x-internal: false
  /query/accounts:
    get:
      summary: Get accounts
      description: Retrieve a list of available data source logins (authentications)
        and their accounts
      operationId: getAccounts
      tags:
      - Data source
      parameters:
      - name: json
        in: query
        required: true
        description: JSON-encoded account query parameters
        example:
          ds_id: GAWA
        schema:
          type: object
          required:
          - ds_id
          properties:
            api_key:
              type: string
              maxLength: 255
              pattern: ^[A-Za-z0-9_-]+$
              description: API key when not using an authorization header
            ds_id:
              type: string
              maxLength: 50
              pattern: ^[A-Za-z0-9_-]+$
              description: Data source ID
            ds_users:
              oneOf:
              - type: string
                maxLength: 255
              - type: array
                maxItems: 100
                items:
                  type: string
