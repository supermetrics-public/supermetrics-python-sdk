components:
  schemas:
    AbstractResponse:
      type: object
      description: Base envelope for all successful API responses. Concrete responses
        extend this via `allOf` and add a `data` property.
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - meta
    AccountTag:
      type: object
      additionalProperties: false
      example:
        name: a1b2c3d
        display_name: EMEA paid media
        color: '#112233'
        data_sources:
        - data_source_id: AW
          accounts:
          - account_id: 123-456-7890
      properties:
        name:
          type: string
          maxLength: 100
          description: The unique name of the account tag
          example: a1b2c3d
        display_name:
          type: string
          maxLength: 255
          description: Human-readable name of the account tag
          example: EMEA paid media
        color:
          type: string
          maxLength: 50
          description: Display color of the account tag
          example: '#112233'
        data_sources:
          type: array
          maxItems: 100
          description: Data sources and their accounts belonging to the tag
          items:
            type: object
          example:
          - data_source_id: AW
            accounts:
            - account_id: 123-456-7890
    AccountTagListResponse:
      type: object
      additionalProperties: false
      required:
      - meta
      - data
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          type: object
          additionalProperties: false
          required:
          - items
          description: Wrapper object holding the team's account tags
          properties:
            items:
              type: array
              maxItems: 500
              description: The list of account tags
              items:
                $ref: '#/components/schemas/AccountTagOverview'
          example:
            items:
            - name: a1b2c3d
              display_name: EMEA paid media
              color: '#112233'
              data_source_count: 3
              account_count: 42
    AccountTagOverview:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
          description: The unique name of the account tag
          example: a1b2c3d
        display_name:
          type: string
          maxLength: 255
          description: Human-readable name of the account tag
          example: EMEA paid media
        color:
          type: string
          maxLength: 50
          description: Display color of the account tag
          example: '#112233'
        data_source_count:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854776000
          description: Number of data sources represented in the tag
          example: 3
        account_count:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854776000
          description: Number of accounts in the tag
          example: 42
    AccountTagResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/AccountTag'
    AuthMethod:
      type: object
      required:
      - id
      - title
      properties:
        id:
          type: string
          maxLength: 100
          description: Authentication method identifier
          example: AUTH_METHOD_KEY_PAIR
        title:
          type: string
          maxLength: 255
          description: Display title for the authentication method
          example: Key Pair Authentication
        fields:
          type: array
          maxItems: 50
          description: Settings the user must fill in to use this authentication method.
          items:
            $ref: '#/components/schemas/SetupSetting'
        new_secret_field:
          description: Setting describing a new secret to supply for this authentication
            method.
          allOf:
          - $ref: '#/components/schemas/SetupSetting'
        is_default:
          type: boolean
          description: Whether this is the default authentication method
          default: false
      additionalProperties: false
    AvailableSourcesResponse:
      type: object
      description: Available data sources and destinations for Hub transfers
      properties:
        data_sources:
          type: array
          description: Available data sources sorted alphabetically by service name
          items:
            $ref: '#/components/schemas/DataSourceInfo'
        destinations:
          type: array
          description: Available transfer destinations
          items:
            $ref: '#/components/schemas/TransferDestination'
        destination_types:
          type: array
          description: Destination type configurations with setup settings and auth
            methods
          items:
            $ref: '#/components/schemas/DestinationTypeSettings'
    Backfill:
      type: object
      required:
      - transfer_backfill_id
      - transfer_id
      - range_start_date
      - range_end_date
      - status
      - created_time
      - created_user_id
      - transfer_runs_total
      - transfer_runs_created
      - transfer_runs_completed
      - transfer_runs_failed
      properties:
        transfer_backfill_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: Unique identifier of the backfill
          example: 12345
        transfer_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: ID of the transfer this backfill belongs to
          example: 456789
        range_start_date:
          type: string
          format: date
          maxLength: 10
          description: Start date of the backfill range
          example: '2024-01-01'
        range_end_date:
          type: string
          format: date
          maxLength: 10
          description: End date of the backfill range
          example: '2024-01-31'
        created_time:
          type: string
          format: date-time
          maxLength: 30
          description: Timestamp when the backfill was created (ISO 8601 format)
          example: '2024-02-01T09:00:00Z'
        created_user_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: ID of the user who created the backfill
          example: 789
        removed_time:
          type: string
          format: date-time
          maxLength: 30
          description: Timestamp when the backfill was cancelled/removed (ISO 8601
            format)
          example: '2024-02-01T15:00:00Z'
          nullable: true
        removed_user_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: ID of the user who cancelled/removed the backfill
          example: 790
          nullable: true
        start_time:
          type: string
          format: date-time
          maxLength: 30
          description: Timestamp when the backfill processing started (ISO 8601 format)
          example: '2024-02-01T10:00:00Z'
          nullable: true
        end_time:
          type: string
          format: date-time
          maxLength: 30
          description: Timestamp when the backfill processing completed (ISO 8601
            format)
          example: '2024-02-01T12:30:00Z'
          nullable: true
        status:
          type: string
          description: Current status of the backfill
          enum:
          - CREATED
          - SCHEDULED
          - RUNNING
          - FAILED
          - COMPLETED
          - CANCELLED
          example: RUNNING
        transfer_runs_total:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Total number of transfer runs created for this backfill
          example: 31
        transfer_runs_created:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Number of transfer runs that have been created
          example: 31
        transfer_runs_completed:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Number of transfer runs that have completed successfully
          example: 25
        transfer_runs_failed:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Number of transfer runs that have failed
          example: 2
        error_report:
          type: array
          description: List of errors that occurred during backfill processing (empty
            array if no errors)
          items:
            $ref: '#/components/schemas/TransferBackfillRunError'
    BackfillResponse:
      type: object
      required:
      - meta
      - data
      properties:
        meta:
          type: object
          description: Metadata included in every API response.
          properties:
            request_id:
              $ref: '#/components/schemas/RequestId'
          required:
          - request_id
          additionalProperties: false
        data:
          $ref: '#/components/schemas/Backfill'
    BlendBaseRequest:
      type: object
      description: Fields shared by the blend create and update requests. Concrete
        request schemas compose this via `allOf` and add their own required-field
        constraints (and, for create, the `type` discriminator).
      properties:
        display_name:
          type: string
          maxLength: 300
          pattern: ^.+
          description: Display name of the blend.
          example: My Blend
        description:
          type: string
          maxLength: 300
          nullable: true
          pattern: ^.+
          description: Optional free-text description of the blend.
          example: Description of the blend
        blended_data_sources:
          type: array
          maxItems: 50
          description: Data sources to include in the blend.
          example: []
          items:
            $ref: '#/components/schemas/BlendedDataSourceInput'
        config:
          type: object
          description: Field mappings and join configuration for the blend.
          allOf:
          - $ref: '#/components/schemas/BlendConfig'
          example: {}
    BlendConfig:
      type: object
      description: Field mappings and join configuration for the blend (request).
        Union blends contain only `fields`; join blends also include `query_table`
        and `joins`.
      properties:
        query_table:
          type: object
          description: Primary (left-hand) data source — present for join blends only.
            Provide `blend_data_source_key` when creating, `blend_data_source_id`
            when updating with an existing data source.
          properties:
            blend_data_source_id:
              type: integer
              format: int64
              nullable: true
              minimum: 1
              maximum: 9223372036854776000
              description: Internal ID of the primary data source.
              example: 146715
            blend_data_source_key:
              type: string
              maxLength: 8
              nullable: true
              pattern: ^[a-z0-9]{8}$
              description: Key of the primary data source (for new data sources).
              example: abcd1234
          example: {}
        joins:
          type: array
          maxItems: 50
          description: Join definitions — present for join blends only.
          example: []
          items:
            $ref: '#/components/schemas/BlendJoin'
        fields:
          type: array
          maxItems: 1000
          description: Field definitions for the blend.
          example: []
          items:
            $ref: '#/components/schemas/BlendField'
      example: {}
    BlendConfigOutput:
      type: object
      description: Field mappings and join configuration for the blend (response).
        Union blends contain only `fields`; join blends also include `query_table`
        and `joins`.
      properties:
        query_table:
          type: object
          description: Primary (left-hand) data source — present for join blends only.
          properties:
            blend_data_source_id:
              type: integer
              format: int64
              nullable: true
              minimum: 1
              maximum: 9223372036854776000
              description: Internal ID of the primary data source.
              example: 146715
          example: {}
        joins:
          type: object
          description: Join definitions — present for join blends only.
          properties:
            items:
              type: array
              maxItems: 50
              description: Join items.
              example: []
              items:
                $ref: '#/components/schemas/BlendJoinOutput'
        fields:
          type: object
          description: Field definitions for the blend.
          properties:
            items:
              type: array
              maxItems: 1000
              description: Field items.
              example: []
              items:
                $ref: '#/components/schemas/BlendFieldOutput'
      example: {}
    BlendCreateRequest:
      description: Payload for creating a new blend. Extends BlendBaseRequest and
        additionally requires the blend `type`. When creating, new data sources are
        referenced by `blend_data_source_key` rather than `blend_data_source_id`.
      allOf:
      - $ref: '#/components/schemas/BlendBaseRequest'
      - type: object
        required:
        - type
        - display_name
        - blended_data_sources
        - config
        properties:
          type:
            type: string
            enum:
            - join
            - union
            description: 'Blend type: `union` stacks rows, `join` joins data sources
              on shared fields.'
            example: union
        example:
          type: union
          display_name: Example Blend
          description: Example blend description
          blended_data_sources:
          - data_source_id: GA4
            blend_data_source_id: null
            blend_data_source_key: abcd1234
            display_name: Google Analytics 4
            report_type: null
            report_type_settings: []
            data_source_settings: []
            accounts: []
            segments: []
          config:
            fields:
            - blend_field_name: impressions
              blend_field_display_name: Impressions
              blend_datasource_fields:
              - blend_data_source_id: null
                blend_data_source_key: abcd1234
                datasource_field_name: Impressions
                datasource_field_display_name: Impressions
                datasource_field_type: met
                datasource_field_data_type: int.number.value
                field_source: standard
                meta: null
    BlendDatasourceFieldRef:
      type: object
      description: A field reference within a data source (request). At least one
        of `blend_data_source_id` or `blend_data_source_key` must be non-null. When
        creating a blend (POST), use `blend_data_source_key`. When updating (PUT),
        use `blend_data_source_id` for existing data sources or `blend_data_source_key`
        for newly added ones.
      required:
      - datasource_field_name
      - field_source
      properties:
        blend_data_source_id:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          maximum: 9223372036854776000
          description: Internal ID of the blended data source. Use for existing data
            sources when updating a blend; null when referencing a new data source
            by key.
          example: 146715
        blend_data_source_key:
          type: string
          maxLength: 8
          nullable: true
          pattern: ^[a-z0-9]{8}$
          description: Temporary key linking a new data source to field/join references
            within the same request. Required when creating a blend; used for new
            data sources when updating. Must be exactly 8 lowercase alphanumeric characters.
          example: abcd1234
        datasource_field_name:
          type: string
          maxLength: 255
          pattern: ^.+
          description: Field name as defined by the data source.
          example: Date
        datasource_field_display_name:
          type: string
          maxLength: 255
          pattern: ^.+
          description: Display name of the field.
          example: Date
        datasource_field_type:
          type: string
          enum:
          - dim
          - met
          description: 'Field type: `dim` (dimension) or `met` (metric).'
          example: dim
        datasource_field_data_type:
          type: string
          maxLength: 100
          pattern: ^.+
          description: Data type of the field (e.g. string.time.date, int.number.value).
          example: string.text.value
        field_source:
          type: string
          enum:
          - standard
          - transformation
          - data_source_account_custom
          description: 'Origin of the field: `standard` = from the data source, `transformation`
            = computed field, `data_source_account_custom` = account-level custom
            field.'
          example: standard
        meta:
          type: object
          nullable: true
          description: Optional metadata, e.g. account-level overrides.
          example: {}
    BlendDatasourceFieldRefOutput:
      type: object
      description: A field reference within a data source (response).
      properties:
        blend_data_source_id:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          maximum: 9223372036854776000
          description: Internal ID of the blended data source.
          example: 146715
        datasource_field_name:
          type: string
          maxLength: 255
          pattern: ^.+
          description: Field name as defined by the data source.
          example: Date
        datasource_field_display_name:
          type: string
          maxLength: 255
          pattern: ^.+
          description: Display name of the field.
          example: Date
        datasource_field_type:
          type: string
          enum:
          - dim
          - met
          description: 'Field type: `dim` (dimension) or `met` (metric).'
          example: dim
        datasource_field_data_type:
          type: string
          maxLength: 100
          pattern: ^.+
          description: Data type of the field (e.g. string.time.date, int.number.value).
          example: string.text.value
        field_source:
          type: string
          enum:
          - standard
          - transformation
          - data_source_account_custom
          description: 'Origin of the field: `standard` = from the data source, `transformation`
            = computed field, `data_source_account_custom` = account-level custom
