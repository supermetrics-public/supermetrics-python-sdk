        name:
          type: string
          maxLength: 100
          example: Google Analytics 4
        description:
          type: string
          maxLength: 2000
        marketing_name:
          type: string
          maxLength: 100
          nullable: true
        logo_url:
          type: string
          maxLength: 500
        categories:
          type: array
          maxItems: 50
          items:
            type: string
            enum:
            - Ad Verification
            - Affiliate
            - Analytics
            - Brand Reputation
            - CRM/Sales
            - Data Warehouses
            - DSP
            - Ecommerce
            - Files
            - Marketing Attribution
            - Marketing Automation
            - Mobile
            - Other
            - Paid Media
            - Payments
            - Retail Media
            - Search
            - SEO
            - Social Media
        products:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 100
          example:
          - API
          - DS
          - SHEETS
          - EXCEL
          - DWH
        status:
          type: string
          enum:
          - Early access
          - Released
          example: Released
        is_premium:
          type: boolean
          example: false
        tags:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 100
          example:
          - popular
        is_authentication_required:
          type: boolean
          example: true
        has_account_list:
          type: boolean
          example: true
        has_fields:
          type: boolean
          example: true
        has_segments:
          type: boolean
          example: false
        has_report_type_selection:
          type: boolean
          example: false
        is_date_range_required:
          type: boolean
          example: true
        is_custom_data_import:
          type: boolean
          example: false
        min_metrics:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          nullable: true
          example: 1
        max_metrics:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          nullable: true
          example: 10
        min_dimensions:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          nullable: true
          example: 0
        max_dimensions:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          nullable: true
          example: 9
        report_type_header_label:
          type: string
          maxLength: 100
          example: Report Type
        account_labels:
          type: object
          nullable: true
          properties:
            plural:
              type: string
              maxLength: 100
            singular:
              type: string
              maxLength: 100
        report_types:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DatasourceReportType'
        common_settings:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DatasourceSetting'
    DatasourceDetailsResponse:
      type: object
      properties:
        meta:
          type: object
          description: Metadata included in every API response.
          properties:
            request_id:
              $ref: '#/components/schemas/RequestId'
          required:
          - request_id
          additionalProperties: false
        data:
          $ref: '#/components/schemas/DatasourceDetails'
    DatasourceOption:
      type: object
      properties:
        option_id:
          type: string
          maxLength: 100
        label:
          type: string
          maxLength: 100
    DatasourceReportType:
      type: object
      properties:
        label:
          type: string
          maxLength: 100
        id:
          type: string
          maxLength: 100
        is_date_range_required:
          type: boolean
        is_free_text_account_required:
          type: boolean
        settings:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DatasourceSetting'
    DatasourceSetting:
      type: object
      properties:
        setting_id:
          type: string
          maxLength: 100
        context:
          type: string
          enum:
          - options
          - reportConfiguration
        type:
          type: string
          enum:
          - checkbox
          - combobox
          - none
          - select
          - text
          - textarea
          - radio
        label:
          type: string
          maxLength: 100
        help_text:
          type: string
          maxLength: 2000
          nullable: true
        default_value:
          type: string
          maxLength: 255
          nullable: true
        options:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DatasourceOption'
        is_value_required:
          type: boolean
    DefinitionValue:
      type: object
      description: A value reference used in transformation steps. Depending on `type`
        the value is read from a data-source field, taken from the previous step's
        output, or supplied as a static literal.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - data_source_field
          - output_from_previous
          - static
          description: 'Where the value comes from: `data_source_field` (a named field
            on the data source), `output_from_previous` (the result of the preceding
            step), or `static` (a literal value).'
          example: data_source_field
        value:
          type: string
          maxLength: 255
          description: 'The value itself: the field name when `type` is `data_source_field`,
            a literal when `type` is `static`, and omitted when `type` is `output_from_previous`.'
          example: platform
      example:
        type: data_source_field
        value: platform
    DestinationInfo:
      type: object
      required:
      - display_name
      - destination_type
      - edit_settings
