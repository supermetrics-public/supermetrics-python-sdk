          example: 936506
      requestBody:
        required: true
        description: The reporting period and product scope to export.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                start_date:
                  type: string
                  format: date
                  maxLength: 10
                  description: Inclusive UTC start date (Y-m-d) of the reporting period.
                  example: '2026-01-01'
                end_date:
                  type: string
                  format: date
                  maxLength: 10
                  description: Inclusive UTC end date (Y-m-d) of the reporting period.
                  example: '2026-01-31'
                product_categories:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: Product categories to export. At least one is required.
                  items:
                    $ref: '#/components/schemas/ProductCategory'
                  example:
                    - API
                    - DS
                license_ids:
                  type: array
                  maxItems: 100
                  description: Restrict the export to these license IDs.
                  items:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9223372036854776000
                  example:
                    - 100
                    - 101
                api_key_ids:
                  type: array
                  maxItems: 100
                  description: Restrict the export to these API key IDs.
                  items:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9223372036854776000
                  example:
                    - 7
                data_sources:
                  type: array
                  maxItems: 100
                  description: Restrict the export to these data source IDs.
                  items:
                    type: string
                    maxLength: 5
                    pattern: ^[A-Za-z0-9_]{2,5}$
                  example:
                    - GA4
                user_ids:
                  type: array
                  maxItems: 100
                  description: Restrict the export to these user IDs.
                  items:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9223372036854776000
                  example:
                    - 42
              required:
                - start_date
                - end_date
                - product_categories
            example:
              start_date: '2026-01-01'
              end_date: '2026-01-31'
              product_categories:
                - API
                - DS
              license_ids:
