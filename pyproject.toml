# Project metadata and configuration
[project]
name = "supermetrics"
dynamic = ["version"]
description = "Official Python client for Supermetrics"
readme = "README.md"
authors = [
    { name = "Aleksei Popov", email = "aleksei.popov@supermetrics.com" },
    { name = "Pablo Rojas", email = "pablo.rojas@supermetrics.com" },
    { name = "Feroj Ahmod", email = "feroj.ahmod@supermetrics.com" }
]
maintainers = [
    { name = "Aleksei Popov", email = "aleksei.popov@supermetrics.com" },
    { name = "Pablo Rojas", email = "pablo.rojas@supermetrics.com" },
    { name = "Feroj Ahmod", email = "feroj.ahmod@supermetrics.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "httpx>=0.25.0",
    "python-dateutil>=2.8.0",
    "attrs>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "openapi-python-client==0.29.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "basedpyright==1.39.10",
    "pyyaml==6.0.3",
]

[project.urls]
homepage = "https://github.com/supermetrics-public/supermetrics-python-sdk"
bugs = "https://github.com/supermetrics-public/supermetrics-python-sdk/issues"
changelog = "https://github.com/supermetrics-public/supermetrics-python-sdk/blob/main/HISTORY.md"

# Build system configuration
[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

# UV package manager configuration
[tool.uv]
package = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.hatch.version]
source = "versioningit"

[tool.hatch.version.format]
distance = "{base_version}.post{distance}"
dirty = "{base_version}"
distance-dirty = "{base_version}.post{distance}"

# Wheel build: include src/ layout
[tool.hatch.build.targets.wheel]
packages = ["src/supermetrics"]

# Ruff configuration
[tool.ruff]
# Target Python version for rules and autofix behavior
target-version = "py311"
# Line length for formatting and linting
line-length = 120
# Source roots for import resolution and formatting context
src = ["src", "tests"]
extend-exclude = ["src/supermetrics/_generated", ".claude"]

[tool.ruff.format]
# Formatter preferences
quote-style = "preserve"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
# Enabled rulesets
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # Pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "UP", # pyupgrade
]
# per-file-ignores = {}

# Mypy strict configuration
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
pretty = true
# mypy_path = "src"

[[tool.mypy.overrides]]
module = "supermetrics._generated.*"
ignore_errors = true
# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers turns an unregistered marker (a typo in `pytest.mark.e2e`, say)
# into a collection error instead of a warning nobody reads.
addopts = "-q --strict-markers"
asyncio_mode = "strict"
markers = [
    "e2e: end-to-end tests that drive the SDK over a real socket against a local HTTP server",
    "live: smoke tests against the real Supermetrics API; skipped unless SUPERMETRICS_API_KEY is set",
]

# basedpyright configuration
#
# A second type checker alongside mypy, and a different one: mypy is nominal and
# checks declarations, pyright infers aggressively and is better at narrowing,
# unreachable code, and overload resolution. Running both catches more than either.
#
# Scoped to the hand-written source. The generated tree is excluded rather than
# fixed — it is regenerated wholesale from the OpenAPI spec, so any finding there
# is a note about openapi-python-client, not about this project, and would be
# overwritten on the next run anyway. `ignore` as well as `exclude` because
# exclude alone still reports on files pulled in through imports.
#
# `standard` rather than basedpyright's default `all`. On `all` this codebase
# reports ~7,800 diagnostics, essentially all of them stylistic strictness
# (reportAny, reportUnannotatedClassAttribute) plus 108 reportInvalidCast on the
# `cast(AuthenticatedClient, self._client)` that every resource adapter performs.
# Tightening those is a real piece of work and a deliberate decision; it is not
# something to smuggle in behind a checker. On `standard` the source is clean, so
# this is a gate that means something today rather than a wall of accepted noise.
[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["src/supermetrics"]
exclude = ["src/supermetrics/_generated"]
ignore = ["src/supermetrics/_generated"]
