# SDK Endpoints Configuration
# This file defines which endpoints to include in the generated SDK
# and allows applying patches/overrides to customize the OpenAPI spec.

# Format:
# endpoints:
#   - method: HTTP_METHOD (GET, POST, PUT, PATCH, DELETE, etc.)
#     path: /api/path
#     rewrite_path: /path/written/into/the/merged/spec  # Optional - see below
#     patches:  # Optional - customize the endpoint definition
#       merge:  # Deep merge these properties with the existing operation
#         description: "Custom description"
#         summary: "Custom summary"
#         tags:
#           - "Custom Tag"
#       replace:  # Completely replace these sections
#         responses:
#           '200':
#             description: "Success"

# ==========================================
# BASELINE PIN
# ==========================================
# Endpoints already present in this merged spec are taken from it verbatim rather
# than re-read from openapi-specs/. That keeps a regeneration purely ADDITIVE: new
# endpoints are pulled from upstream, shipped ones keep the exact tags, operationIds
# and schemas the committed src/supermetrics/_generated/ tree was built from.
#
# Why this exists: the upstream specs drift. Operations get retagged, which moves the
# generated API subpackage and breaks the hand-written adapters' imports, and paths
# get reparameterised (GET /query/data/json became GET /query/data/{context_type}).
# Absorbing that drift as a side effect of adding one new domain is how you ship a
# broken SDK.
#
# To deliberately refresh a pinned endpoint against upstream, delete its entry from
# the committed openapi-spec.yaml, or set this key to null for a full refresh — then
# expect to update the affected adapters in the same change.
pin_baseline: openapi-spec.yaml

endpoints:
  # Data Source Logins
  - method: GET
    path: /ds/logins

  - method: GET
    path: /ds/login/{login_id}

  # Revoke a login (Phase 7). Upstream (openap-management.yaml) leaves this operation
  # untagged, which would place it in the generated `api/default/` subpackage; the tag
  # patch keeps it beside get/list in `api/data_source_logins/`.
  - method: DELETE
    path: /ds/login/{login_id}
    patches:
      merge:
        tags:
          - Data Source Logins

  - method: GET
    path: /ds/login/{login_id}/accounts
    patches:
      merge:
        tags:
          - Data Source Logins

  # Data Source Login Links
  - method: GET
    path: /ds/login/links

  - method: POST
    path: /ds/login/link

  - method: GET
    path: /ds/login/link/{link_id}

  # Update a login link (Phase 7). Upstream tags this operation `Data Source Logins`
  # (in fact leaves it untagged), which would split it away from the other link
  # operations; the tag patch keeps it in `api/data_source_login_links/`.
  - method: PATCH
    path: /ds/login/link/{link_id}
    patches:
      merge:
        tags:
          - Data Source Login Links

  - method: PUT
    path: /ds/login/link/{link_id}/close

  # Accounts
  - method: GET
    path: /query/accounts

  # Queries
  - method: GET
    path: /query/data/json

  # DWH Backfills
  - method: POST
    path: /teams/{team_id}/transfers/{transfer_id}/backfills

  - method: GET
    path: /teams/{team_id}/transfers/{transfer_id}/backfills/latest

  - method: GET
    path: /teams/{team_id}/backfills

  - method: GET
    path: /teams/{team_id}/backfills/{backfill_id}

  - method: PATCH
    path: /teams/{team_id}/backfills/{backfill_id}

  # DWH Data Transfers & Transfer Runs
  #
  # Upstream splits the "/v1" between the path key and the path-level `servers` entry:
  # the transfers paths are "/v1/teams/..." served from https://dts-api.supermetrics.com,
  # while data-source-connections is "/teams/..." served from ".../v1". Both resolve to
  # https://dts-api.supermetrics.com/v1, but openapi-python-client ignores path-level
  # servers and simply concatenates base_url + path, so the two shapes cannot coexist
  # under one base URL. rewrite_path normalises the first group onto the second's
  # convention, which is also what the already-shipped backfills endpoints use.
  - method: GET
    path: /v1/teams/{team_id}/transfers
    rewrite_path: /teams/{team_id}/transfers
  - method: POST
    path: /v1/teams/{team_id}/transfers
    rewrite_path: /teams/{team_id}/transfers
  - method: GET
    path: /v1/teams/{team_id}/transfers/{transfer_id}
    rewrite_path: /teams/{team_id}/transfers/{transfer_id}
  - method: PUT
    path: /v1/teams/{team_id}/transfers/{transfer_id}
    rewrite_path: /teams/{team_id}/transfers/{transfer_id}
  - method: DELETE
    path: /v1/teams/{team_id}/transfers/{transfer_id}
    rewrite_path: /teams/{team_id}/transfers/{transfer_id}
  - method: PUT
    path: /v1/teams/{team_id}/transfers/{transfer_id}/state
    rewrite_path: /teams/{team_id}/transfers/{transfer_id}/state
  - method: POST
    path: /v1/teams/{team_id}/transfers/validations
    rewrite_path: /teams/{team_id}/transfers/validations
  - method: POST
    path: /v1/teams/{team_id}/transfers/{transfer_id}/validations
    rewrite_path: /teams/{team_id}/transfers/{transfer_id}/validations
  - method: GET
    path: /v1/teams/{team_id}/transfers/available-sources
    rewrite_path: /teams/{team_id}/transfers/available-sources
  - method: GET
    path: /v1/teams/{team_id}/transfers/available-options
    rewrite_path: /teams/{team_id}/transfers/available-options
  - method: GET
    path: /v1/teams/{team_id}/transfers/{transfer_id}/runs
    rewrite_path: /teams/{team_id}/transfers/{transfer_id}/runs
  - method: GET
    path: /v1/teams/{team_id}/transfer_runs/{transfer_run_id}
    rewrite_path: /teams/{team_id}/transfer_runs/{transfer_run_id}

  # DWH Data Source Connections (already "/teams/..." upstream; no rewrite needed)
  - method: POST
    path: /teams/{team_id}/data-source-connections

  # DWH Data Warehouse Destinations
  #
  # Already "/teams/..." served from ".../v1" upstream, the same shape as
  # data-source-connections, so no rewrite_path is needed.
  - method: GET
    path: /teams/{team_id}/destinations
  - method: POST
    path: /teams/{team_id}/destinations
  - method: GET
    path: /teams/{team_id}/destinations/{destination_id}
  - method: PUT
    path: /teams/{team_id}/destinations/{destination_id}
  - method: DELETE
    path: /teams/{team_id}/destinations/{destination_id}
  - method: POST
    path: /teams/{team_id}/destinations/test-connection
  - method: GET
    path: /teams/{team_id}/destinations/{destination_id}/usage

  # Datasource
  - method: GET
    path: /teams/{team_id}/datasource/{data_source_id}

  # Connector Builder - Connectors
  - method: GET
    path: /v1/teams/{team_id}/connector_builder/connectors
  - method: POST
    path: /v1/teams/{team_id}/connector_builder/connectors
  - method: GET
    path: /v1/teams/{team_id}/connector_builder/connectors/{connector_identifier}
  - method: PUT
    path: /v1/teams/{team_id}/connector_builder/connectors/{connector_identifier}
  - method: DELETE
    path: /v1/teams/{team_id}/connector_builder/connectors/{connector_identifier}

  # Connector Builder - Secrets
  - method: GET
    path: /v1/teams/{team_id}/connector_builder/connectors/{connector_identifier}/secrets
  - method: POST
    path: /v1/teams/{team_id}/connector_builder/connectors/{connector_identifier}/secrets
  - method: PUT
    path: /v1/teams/{team_id}/connector_builder/connectors/{connector_identifier}/secrets/{secret_placeholder}
  - method: DELETE
    path: /v1/teams/{team_id}/connector_builder/connectors/{connector_identifier}/secrets/{secret_placeholder}

  # Connector Builder - Logs
  - method: GET
    path: /v1/teams/{team_id}/connector_builder/connectors/{connector_identifier}/logs
  - method: GET
    path: /v1/teams/{team_id}/connector_builder/connectors/{connector_identifier}/logs/{log_id}

  # Connector Builder - Logo
  - method: GET
    path: /v1/teams/{team_id}/connector_builder/connectors/{connector_identifier}/logo
  - method: POST
    path: /v1/teams/{team_id}/connector_builder/connectors/{connector_identifier}/logo

  # Custom Fields
  #
  # Core-API paths, the same shape as Connector Builder: the upstream path-level server
  # is https://api.supermetrics.com and the "/v1" lives in the path. No rewrite_path —
  # rewriting these to /teams/... would drop the /v1 the core API requires *and* move
  # them into the shape _DTS_PATH_PATTERN inspects, which is how you accidentally send
  # a core-API call to the Data Warehouse host.
  - method: GET
    path: /v1/teams/{team_id}/custom-fields
  - method: POST
    path: /v1/teams/{team_id}/custom-fields
  - method: GET
    path: /v1/teams/{team_id}/custom-fields/{custom_field_id}
  - method: PUT
    path: /v1/teams/{team_id}/custom-fields/{custom_field_id}
  - method: DELETE
    path: /v1/teams/{team_id}/custom-fields/{custom_field_id}
  - method: GET
    path: /v1/teams/{team_id}/custom-fields/metadata

  # Account Tags
  #
  # Core-API paths, the same shape as Custom Fields and Connector Builder: the upstream
  # path-level server is https://api.supermetrics.com and the "/v1" lives in the path. No
  # rewrite_path, for the same two reasons — rewriting to /teams/... would drop the /v1 the
  # core API requires, and would move these into the shape _DTS_PATH_PATTERN inspects.
  - method: GET
    path: /v1/teams/{team_id}/account_tags
  - method: POST
    path: /v1/teams/{team_id}/account_tags
  - method: GET
    path: /v1/teams/{team_id}/account_tags/{name}
  - method: PUT
    path: /v1/teams/{team_id}/account_tags/{name}
  - method: DELETE
    path: /v1/teams/{team_id}/account_tags/{name}
  - method: PATCH
    path: /v1/teams/{team_id}/account_tags/{name}/add
  - method: PATCH
    path: /v1/teams/{team_id}/account_tags/{name}/remove

  # Data Blending
  #
  # Core-API paths, the same shape as Custom Fields: the upstream path-level server is
  # https://api.supermetrics.com and the "/v1" already sits in the path key. No
  # rewrite_path, for the same two reasons — rewriting to /teams/... would drop the /v1
  # the core API requires, and it would move these paths into the shape
  # _DTS_PATH_PATTERN matches, sending a core-API call to the Data Warehouse host.
  - method: GET
    path: /v1/teams/{team_id}/data-blending/blends
  - method: POST
    path: /v1/teams/{team_id}/data-blending/blends
  - method: GET
    path: /v1/teams/{team_id}/data-blending/blends/{blend_id}
  - method: PUT
    path: /v1/teams/{team_id}/data-blending/blends/{blend_id}
  - method: DELETE
    path: /v1/teams/{team_id}/data-blending/blends/{blend_id}

  # ==========================================
  # EXAMPLE: Endpoint with comprehensive patches
  # ==========================================
  # - method: GET
  #   path: /example/endpoint
  #   patches:
  #     merge:
  #       # These properties are deep-merged with the existing operation
  #       description: "Enhanced description for this endpoint"
  #       summary: "Get example data"
  #       tags:
  #         - "Examples"
  #       # Add or modify parameters
  #       parameters:
  #         - name: include_metadata
  #           in: query
  #           description: "Include metadata in response"
  #           required: false
  #           schema:
  #             type: boolean
  #             default: false
  #     replace:
  #       # These sections completely replace the existing ones
  #       responses:
  #         '200':
  #           description: "Successful response"
  #           content:
  #             application/json:
  #               schema:
  #                 type: object
  #                 properties:
  #                   data:
  #                     type: array
  #                     items:
  #                       type: string
  #                   metadata:
  #                     type: object
  #         '400':
  #           description: "Bad request"
  #         '401':
  #           description: "Unauthorized"

# ==========================================
# COMPONENT PATCHES
# ==========================================
# Apply patches to shared components (schemas, responses, parameters, etc.)
# This is more efficient than inlining entire schemas in endpoint patches

component_patches:
  # Schemas patches
  schemas:
    # Make cache_time nullable in DataResponse schema
    DataResponse:
      merge:
        properties:
          meta:
            properties:
              result:
                properties:
                  cache_time:
                    nullable: true
